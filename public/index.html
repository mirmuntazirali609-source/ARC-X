<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">
  <title>ARC-X — AI Search</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0b0f;
      --sidebar: #111116;
      --card: #17171e;
      --card2: #1d1d25;
      --border: #2a2a35;
      --text: #f5f5f7;
      --muted: #9999a6;
      --accent: #7c5cff;
      --accent2: #4da3ff;
      --danger: #ff6b6b;
    }

    body.light {
      --bg: #f7f7f9;
      --sidebar: #ffffff;
      --card: #ffffff;
      --card2: #f0f0f4;
      --border: #dedee6;
      --text: #16161b;
      --muted: #666672;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 270px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 24px;
    }

    .logo {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .brand-sub {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
      letter-spacing: 1px;
    }

    .new-chat {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      padding: 12px;
      font-weight: 700;
      text-align: left;
      margin-bottom: 18px;
    }

    .new-chat:hover {
      background: var(--card2);
    }

    .side-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin: 6px 4px 10px;
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
    }

    .history-item {
      padding: 10px 11px;
      border-radius: 9px;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .history-item:hover,
    .history-item.active {
      background: var(--card2);
      color: var(--text);
    }

    .empty-history {
      color: var(--muted);
      font-size: 12px;
      padding: 5px;
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 10px;
    }

    .side-button {
      width: 100%;
      background: transparent;
      border: 0;
      color: var(--muted);
      text-align: left;
      padding: 10px 5px;
      border-radius: 8px;
    }

    .side-button:hover {
      color: var(--text);
      background: var(--card2);
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .mobile-brand {
      display: none;
      align-items: center;
      gap: 8px;
      font-weight: 800;
    }

    .mobile-brand .logo {
      width: 32px;
      height: 32px;
    }

    .mode-label {
      color: var(--muted);
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-button,
    .menu-button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 9px;
      width: 38px;
      height: 38px;
    }

    .menu-button {
      display: none;
    }

    /* =========================
       HOME
    ========================= */

    .home {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 65px 20px 120px;
    }

    .hero-logo {
      width: 78px;
      height: 78px;
      margin-bottom: 20px;
    }

    .hero-title {
      font-size: clamp(32px, 5vw, 50px);
      font-weight: 800;
      text-align: center;
      letter-spacing: -1.5px;
    }

    .hero-text {
      color: var(--muted);
      text-align: center;
      margin-top: 12px;
      max-width: 620px;
      line-height: 1.6;
      font-size: 15px;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-wrap {
      width: min(820px, 100%);
      margin-top: 32px;
    }

    .composer {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 18px;
      padding: 13px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .15);
    }

    textarea {
      width: 100%;
      min-height: 72px;
      max-height: 180px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 7px;
      font-size: 16px;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 5px;
    }

    .modes {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mode {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
    }

    .mode:hover {
      color: var(--text);
      background: var(--card2);
    }

    .mode.active {
      color: white;
      background: var(--accent);
      border-color: var(--accent);
    }

    .send {
      border: 0;
      background: var(--text);
      color: var(--bg);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      font-size: 18px;
      flex-shrink: 0;
      font-weight: 800;
    }

    .send:hover {
      opacity: .85;
    }

    .send:disabled {
      opacity: .45;
    }

    /* =========================
       SUGGESTIONS
    ========================= */

    .suggestions {
      width: min(820px, 100%);
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .suggestion {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      padding: 14px;
      text-align: left;
      font-size: 13px;
    }

    .suggestion:hover {
      background: var(--card2);
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      flex: 1;
      display: none;
      flex-direction: column;
      min-height: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 30px 20px 150px;
    }

    .message {
      width: min(820px, 100%);
      margin: 0 auto 26px;
    }

    .message.user {
      display: flex;
      justify-content: flex-end;
    }

    .user-bubble {
      max-width: 75%;
      background: var(--card2);
      border: 1px solid var(--border);
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant-content {
      line-height: 1.7;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .sources {
      margin-top: 18px;
      border-top: 1px solid var(--border);
      padding-top: 13px;
    }

    .sources-title {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .source {
      display: block;
      color: var(--accent2);
      font-size: 12px;
      text-decoration: none;
      padding: 6px 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .source:hover {
      text-decoration: underline;
    }

    .chat-composer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 15px 20px 20px;
      background: linear-gradient(
        transparent,
        var(--bg) 25%
      );
    }

    .chat-composer-inner {
      width: min(820px, 100%);
      margin: auto;
    }

    /* =========================
       LOADING / ERROR
    ========================= */

    .loading {
      display: flex;
      gap: 5px;
      padding: 8px 0;
      align-items: center;
    }

    .loading-text {
      color: var(--muted);
      font-size: 13px;
      margin-left: 7px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: pulse 1s infinite alternate;
    }

    .dot:nth-child(2) {
      animation-delay: .2s;
    }

    .dot:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes pulse {
      from {
        opacity: .25;
      }

      to {
        opacity: 1;
      }
    }

    .error {
      color: var(--danger);
      line-height: 1.6;
    }

    .status {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 760px) {
      body {
        overflow: hidden;
      }

      .sidebar {
        position: fixed;
        z-index: 20;
        left: -290px;
        top: 0;
        bottom: 0;
        transition: left .2s ease;
        box-shadow: 10px 0 40px rgba(0, 0, 0, .3);
      }

      .sidebar.open {
        left: 0;
      }

      .menu-button {
        display: block;
      }

      .mobile-brand {
        display: flex;
      }

      .topbar {
        padding: 0 12px;
      }

      .mode-label {
        display: none;
      }

      .home {
        padding-top: 45px;
      }

      .hero-logo {
        width: 65px;
        height: 65px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .composer-bottom {
        align-items: flex-end;
      }

      .modes {
        max-width: calc(100% - 50px);
      }

      .mode {
        padding: 6px 8px;
      }

      .user-bubble {
        max-width: 88%;
      }

      .chat-composer {
        padding: 10px;
      }

      .messages {
        padding: 20px 12px 150px;
      }
    }
  </style></head><body><div class="app">  <!-- SIDEBAR -->  <aside class="sidebar" id="sidebar"><div class="brand">

  </main></div><script>
  /* =====================================================
     ARC-X FRONTEND ENGINE
  ===================================================== */

  let selectedMode = "auto";
  let conversationId = null;
  let isSending = false;


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const home = document.getElementById("home");
  const chat = document.getElementById("chat");

  const homeInput = document.getElementById("homeInput");
  const chatInput = document.getElementById("chatInput");

  const homeSend = document.getElementById("homeSend");
  const chatSend = document.getElementById("chatSend");

  const messages = document.getElementById("messages");
  const history = document.getElementById("history");

  const newChat = document.getElementById("newChat");
  const themeButton = document.getElementById("themeButton");
  const topTheme = document.getElementById("topTheme");

  const menuButton = document.getElementById("menuButton");
  const sidebar = document.getElementById("sidebar");
  const topMode = document.getElementById("topMode");
  const homeStatus = document.getElementById("homeStatus");


  /* =====================================================
     MODE
  ===================================================== */

  function setMode(mode) {
    selectedMode = mode;

    document.querySelectorAll(".mode").forEach(function(button) {
      button.classList.toggle(
        "active",
        button.dataset.mode === mode
      );
    });

    const labels = {
      auto: "Auto mode",
      search: "Search mode",
      think: "Think mode",
      research: "Research mode",
      code: "Code mode",
      create: "Create mode"
    };

    topMode.textContent = labels[mode] || "Auto mode";
  }


  document.querySelectorAll(".mode").forEach(function(button) {
    button.addEventListener("click", function() {
      setMode(button.dataset.mode);
    });
  });


  /* =====================================================
     THEME
  ===================================================== */

  function applyTheme(theme) {
    if (theme === "light") {
      document.body.classList.add("light");
    } else {
      document.body.classList.remove("light");
    }

    localStorage.setItem("arcx_theme", theme);
  }


  function toggleTheme() {
    const isLight = document.body.classList.contains("light");
    applyTheme(isLight ? "dark" : "light");
  }


  const savedTheme = localStorage.getItem("arcx_theme");
