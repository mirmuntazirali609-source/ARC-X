<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARC-X — AI Search & Research</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #ffffff;
  --sidebar: #f7f7f8;
  --text: #171717;
  --muted: #737373;
  --border: #e5e5e5;
  --card: #fafafa;
  --input: #ffffff;
  --accent: #111111;
  --user: #f1f1f1;
  --blue: #19a7ff;
  --purple: #713cff;
}

body.dark {
  --bg: #171717;
  --sidebar: #202020;
  --text: #f5f5f5;
  --muted: #a3a3a3;
  --border: #353535;
  --card: #242424;
  --input: #242424;
  --accent: #ffffff;
  --user: #2c2c2c;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  overflow: hidden;
}

/* =========================
   APP
========================= */

.app {
  display: flex;
  width: 100%;
  height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
  width: 270px;
  min-width: 270px;
  height: 100vh;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 14px;
  z-index: 50;
  transition: transform 0.25s ease;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 7px 18px;
}

.logo {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: #0b0b0d;
  padding: 5px;
  overflow: hidden;
  box-shadow: 0 5px 18px rgba(80, 70, 255, 0.16);
}

.logo svg {
  width: 100%;
  height: 100%;
  display: block;
}

.brand-name {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.7px;
}

.new-chat {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  border-radius: 11px;
  padding: 12px 13px;
  text-align: left;
  cursor: pointer;
  font-size: 14px;
  font-weight: 650;
}

.new-chat:hover {
  background: var(--card);
}

.sidebar-title {
  color: var(--muted);
  font-size: 12px;
  font-weight: 650;
  margin: 24px 8px 9px;
}

.history {
  flex: 1;
  overflow-y: auto;
}

.history-item {
  padding: 10px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.history-item:hover {
  background: var(--card);
}

.sidebar-bottom {
  border-top: 1px solid var(--border);
  padding-top: 10px;
}

.sidebar-btn {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--text);
  padding: 10px;
  border-radius: 9px;
  text-align: left;
  cursor: pointer;
  font-size: 13px;
}

.sidebar-btn:hover {
  background: var(--card);
}

/* =========================
   MAIN
========================= */

.main {
  flex: 1;
  min-width: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 58px;
  min-height: 58px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}

.mobile-menu {
  display: none;
  border: 0;
  background: transparent;
  color: var(--text);
  font-size: 22px;
  cursor: pointer;
}

.top-mode {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.status {
  font-size: 12px;
  color: var(--muted);
}

/* =========================
   HOME
========================= */

.home {
  flex: 1;
  overflow-y: auto;
  display: flex;
  justify-content: center;
  padding: 8vh 20px 40px;
}

.hero {
  width: min(800px, 100%);
  text-align: center;
}

.hero-logo {
  width: 76px;
  height: 76px;
  border-radius: 24px;
  background: #0b0b0d;
  padding: 10px;
  overflow: hidden;
  margin: 0 auto 24px;
  box-shadow:
    0 12px 45px rgba(25, 167, 255, 0.16),
    0 12px 45px rgba(113, 60, 255, 0.16);
}

.hero-logo svg {
  width: 100%;
  height: 100%;
  display: block;
}

.hero h1 {
  margin: 0;
  font-size: clamp(30px, 5vw, 46px);
  line-height: 1.08;
  letter-spacing: -2px;
  font-weight: 750;
}

.hero-subtitle {
  margin: 14px 0 32px;
  color: var(--muted);
  font-size: 15px;
}

/* =========================
   COMPOSER
========================= */

.composer {
  width: 100%;
  background: var(--input);
  border: 1px solid var(--border);
  border-radius: 19px;
  padding: 12px;
  box-shadow: 0 8px 35px rgba(0, 0, 0, 0.055);
  text-align: left;
}

.prompt {
  width: 100%;
  min-height: 74px;
  max-height: 220px;
  resize: none;
  outline: none;
  border: 0;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  line-height: 1.5;
  padding: 5px;
}

.prompt::placeholder {
  color: var(--muted);
}

.composer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.tools {
  display: flex;
  gap: 7px;
  align-items: center;
}

.tool {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  border-radius: 9px;
  padding: 8px 10px;
  cursor: pointer;
  font-size: 12px;
}

.tool:hover {
  background: var(--card);
}

.send {
  width: 39px;
  height: 39px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: var(--bg);
  cursor: pointer;
  font-size: 19px;
  font-weight: 700;
}

.send:hover {
  opacity: 0.85;
}

.send:disabled {
  opacity: 0.35;
  cursor: default;
}

/* =========================
   MODES
========================= */

.mode-bar {
  display: flex;
  justify-content: center;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 13px;
}

.mode {
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--muted);
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 12px;
  cursor: pointer;
}

.mode:hover {
  color: var(--text);
}

.mode.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}

/* =========================
   SUGGESTIONS
========================= */

.suggestions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 28px;
  text-align: left;
}

.suggestion {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 13px;
  padding: 14px;
  cursor: pointer;
  font-size: 13px;
  text-align: left;
  transition: transform 0.15s ease;
}

.suggestion:hover {
  transform: translateY(-2px);
}

/* =========================
   CHAT
========================= */

.chat {
  flex: 1;
  overflow-y: auto;
  display: none;
  padding: 30px 20px 140px;
}

.chat-inner {
  width: min(800px, 100%);
  margin: 0 auto;
}

.message {
  margin-bottom: 28px;
}

.message.user {
  display: flex;
  justify-content: flex-end;
}

.user-bubble {
  max-width: 76%;
  background: var(--user);
  border-radius: 17px;
  padding: 11px 15px;
  font-size: 14px;
  line-height: 1.55;
}

.assistant {
  font-size: 15px;
  line-height: 1.72;
  overflow-wrap: anywhere;
}

.assistant strong {
  font-weight: 750;
}

.assistant pre {
  background: #111111;
  color: #eeeeee;
  padding: 15px;
  border-radius: 12px;
  overflow-x: auto;
  line-height: 1.5;
}

.assistant code {
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;
}

.assistant:not(pre) code {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 2px 5px;
  border-radius: 5px;
}

/* =========================
   SOURCES
========================= */

.sources {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.sources-title {
  font-size: 13px;
  font-weight: 750;
  margin-bottom: 7px;
}

.source {
  display: block;
  color: var(--text);
  text-decoration: none;
  font-size: 12px;
  padding: 7px 0;
  opacity: 0.8;
}

.source:hover {
  opacity: 1;
  text-decoration: underline;
}

/* =========================
   CHAT COMPOSER
========================= */

.chat-composer {
  position: fixed;
  display: none;
  bottom: 0;
  left: 270px;
  right: 0;
  padding: 25px 20px 18px;
  background: linear-gradient(
    transparent,
    var(--bg) 30%
  );
  z-index: 10;
}

.chat-composer-inner {
  width: min(800px, 100%);
  margin: auto;
}

/* =========================
   LOADING
========================= */

.loading {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 25px;
}

.dots span {
  animation: blink 1.2s infinite;
}

.dots span:nth-child(2) {
  animation-delay: 0.2s;
}

.dots span:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes blink {
  0%,
  80%,
  100% {
    opacity: 0.2;
  }

  40% {
    opacity: 1;
  }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 750px) {

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    transform: translateX(-100%);
    box-shadow: 8px 0 30px rgba(0, 0, 0, 0.15);
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .mobile-menu {
    display: block;
  }

  .topbar {
    padding: 0 13px;
  }

  .home {
    padding: 7vh 14px 30px;
  }

  .hero-logo {
    width: 66px;
    height: 66px;
  }

  .hero h1 {
    font-size: 32px;
    letter-spacing: -1.4px;
  }

  .hero-subtitle {
    font-size: 14px;
  }

  .suggestions {
    grid-template-columns: 1fr;
  }

  .chat {
    padding: 24px 14px 130px;
  }

  .chat-composer {
    left: 0;
    padding: 12px;
  }

  .user-bubble {
    max-width: 88%;
  }

  .tool:nth-child(n + 3) {
    display: none;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">

      <div class="logo">

        <svg viewBox="0 0 100 100">

          <defs>
            <linearGradient
              id="arcLogoGradient"
              x1="0"
              y1="0"
              x2="1"
              y2="1"
            >
              <stop
                offset="0%"
                stop-color="#19a7ff"
              />

              <stop
                offset="100%"
                stop-color="#713cff"
              />
            </linearGradient>
          </defs>

          <path
            d="M25 20 L50 45 L75 20 L82 28 L57 53 L82 78 L75 85 L50 60 L25 85 L18 78 L43 53 L18 28 Z"
            fill="url(#arcLogoGradient)"
          />

          <ellipse
            cx="50"
            cy="53"
            rx="39"
            ry="14"
            fill="none"
            stroke="#d9e4ff"
            stroke-width="5"
            transform="rotate(-15 50 53)"
          />

        </svg>

      </div>

      <div class="brand-name">
        ARC-X
      </div>

    </div>

    <button
      class="new-chat"
      onclick="newChat()"
    >
      ＋ New chat
    </button>

    <div class="sidebar-title">
      Recent
    </div>

    <div
      class="history"
      id="history"
    ></div>

    <div class="sidebar-bottom">

      <button
        class="sidebar-btn"
        onclick="toggleTheme()"
      >
        ◐ Appearance
      </button>

      <button
        class="sidebar-btn"
        onclick="showAbout()"
      >
        ◉ About ARC-X
      </button>

    </div>

  </aside>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="main">

    <header class="topbar">

      <div
        style="
          display:flex;
          align-items:center;
          gap:12px;
        "
      >

        <button
          class="mobile-menu"
          onclick="toggleSidebar()"
        >
          ☰
        </button>

        <div
          class="top-mode"
          id="topMode"
        >
          ARC-X
        </div>

      </div>

      <div
        class="status"
        id="status"
      >
        Ready
      </div>

    </header>


    <!-- =========================
         HOME
    ========================== -->

    <section
      class="home"
      id="home"
    >

      <div class="hero">

        <div class="hero-logo">

          <svg viewBox="0 0 100 100">

            <defs>
              <linearGradient
                id="heroLogoGradient"
                x1="0"
                y1="0"
                x2="1"
                y2="1"
              >
                <stop
                  offset="0%"
                  stop-color="#19a7ff"
                />

                <stop
                  offset="100%"
                  stop-color="#713cff"
                />
              </linearGradient>
            </defs>

            <path
              d="M25 20 L50 45 L75 20 L82 28 L57 53 L82 78 L75 85 L50 60 L25 85 L18 78 L43 53 L18 28 Z"
              fill="url(#heroLogoGradient)"
            />

            <ellipse
              cx="50"
              cy="53"
              rx="39"
              ry="14"
              fill="none"
              stroke="#d9e4ff"
              stroke-width="5"
              transform="rotate(-15 50 53)"
            />

          </svg>

        </div>

        <h1>
          What can ARC-X help you with?
        </h1>

        <div class="hero-subtitle">
          Search. Think. Research. Create.
        </div>


        <!-- MAIN COMPOSER -->

        <div class="composer">

          <textarea
            id="prompt"
            class="prompt"
            placeholder="Ask anything..."
            oninput="resizePrompt(this)"
            onkeydown="handleKey(event)"
          ></textarea>

          <div class="composer-bottom">

            <div class="tools">

              <button
                class="tool"
                title="Attachments"
              >
                ＋
              </button>

              <button
                class="tool"
                onclick="selectMode('search')"
              >
                Search
              </button>

              <button
                class="tool"
                onclick="selectMode('research')"
              >
                Research
              </button>

            </div>

            <button
              class="send"
              id="homeSend"
              onclick="askARCX(false)"
            >
              ↑
            </button>

          </div>

        </div>


        <!-- MODES -->

        <div class="mode-bar">

          <button
            class="mode active"
            data-mode="auto"
            onclick="selectMode('auto')"
          >
            Auto
          </button>

          <button
            class="mode"
            data-mode="search"
            onclick="selectMode('search')"
          >
            Search
          </button>

          <button
            class="mode"
            data-mode="think"
            onclick="selectMode('think')"
          >
            Think
          </button>

          <button
            class="mode"
            data-mode="research"
            onclick="selectMode('research')"
          >
            Deep Research
          </button>

          <button
            class="mode"
            data-mode="code"
            onclick="selectMode('code')"
          >
            Code
          </button>

          <button
            class="mode"
            data-mode="create"
            onclick="selectMode('create')"
          >
            Create
          </button>

        </div>


        <!-- SUGGESTIONS -->

        <div class="suggestions">

          <button
            class="suggestion"
            onclick="useSuggestion(
              'Explain quantum computing simply'
            )"
          >
            ✦ Explain something
          </button>

          <button
            class="suggestion"
            onclick="useSuggestion(
              'What are the latest AI developments?'
            )"
          >
            ◈ Latest AI developments
          </button>

          <button
            class="suggestion"
            onclick="useSuggestion(
              'Research the future of AI search engines'
            )"
          >
            ◉ Research a topic
          </button>

          <button
            class="suggestion"
            onclick="useSuggestion(
              'Help me build a modern web application'
            )"
          >
            ◆ Build something
          </button>

        </div>

      </div>

    </section>


    <!-- =========================
         CHAT
    ========================== -->

    <section
      class="chat"
      id="chat"
    >

      <div
        class="chat-inner"
        id="chatInner"
      ></div>

    </section>


    <!-- =========================
         CHAT COMPOSER
    ========================== -->

    <div
      class="chat-composer"
      id="chatComposer"
    >

      <div class="chat-composer-inner">

        <div class="composer">

          <textarea
            id="chatPrompt"
            class="prompt"
            placeholder="Message ARC-X..."
            oninput="resizePrompt(this)"
            onkeydown="handleChatKey(event)"
          ></textarea>

          <div class="composer-bottom">

            <div class="tools">

              <button
                class="tool"
                title="Attachments"
              >
                ＋
              </button>

              <button
                class="tool"
                onclick="selectMode('search')"
              >
                Search
              </button>

              <button
                class="tool"
                onclick="selectMode('research')"
              >
                Research
              </button>

            </div>

            <button
              class="send"
              onclick="askARCX(true)"
            >
              ↑
            </button>

          </div>

        </div>

      </div>

    </div>

  </main>

</div>


<script>

/* =====================================================
   ARC-X
   FRONTEND ENGINE
===================================================== */

let conversationId =
  localStorage.getItem(
    "arcx_conversation_id"
  ) || "";

let selectedMode = "auto";

let history = [];

try {
  history = JSON.parse(
    localStorage.getItem(
      "arcx_history"
    ) || "[]"
  );
} catch {
  history = [];
}


/* =====================================================
   MODE SELECTOR
===================================================== */

function selectMode(mode) {

  selectedMode = mode;

  document
    .querySelectorAll(".mode")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.mode === mode
      );

    });

  const title =
    mode === "auto"
      ? "ARC-X"
      : "ARC-X · " +
        mode.charAt(0).toUpperCase() +
        mode.slice(1);

  document.getElementById(
    "topMode"
  ).textContent = title;
}


/* =====================================================
   SUGGESTION
===================================================== */

function useSuggestion(text) {

  const prompt =
    document.getElementById(
      "prompt"
    );

  prompt.value = text;

  resizePrompt(prompt);

  prompt.focus();
}


/* =====================================================
   KEYBOARD
===================================================== */

function handleKey(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    askARCX(false);
  }
}


function handleChatKey(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    askARCX(true);
  }
}


/* =====================================================
   TEXTAREA SIZE
===================================================== */

function resizePrompt(element) {

  element.style.height = "auto";

  element.style.height =
    Math.min(
      element.scrollHeight,
      220
    ) + "px";
}


/* =====================================================
   MAIN ARC-X REQUEST
===================================================== */

async function askARCX(fromChat = false) {

  const input =
    document.getElementById(
      fromChat
        ? "chatPrompt"
        : "prompt"
    );

  const question =
    input.value.tri
