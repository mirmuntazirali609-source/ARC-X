<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020816">
<meta name="description" content="ARC X — AI Super App">
<title>ARC X — AI Super App</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#020816;
  --panel:#071120;
  --panel2:#0b1728;
  --border:#1b2b42;
  --text:#f5f7fb;
  --muted:#91a0b5;
  --blue:#6676ff;
  --cyan:#36d7ff;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(54,215,255,.12),
      transparent 35%
    ),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button:focus-visible,
textarea:focus-visible,
a:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:2px;
}

.app{
  min-height:100vh;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:275px;
  padding:18px;
  background:#040c18;
  border-right:1px solid var(--border);
  z-index:100;
  display:flex;
  flex-direction:column;
  transition:.25s;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.logo{
  width:40px;
  height:40px;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-weight:900;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
}

.brand strong{
  display:block;
}

.brand small{
  color:var(--muted);
  font-size:10px;
  letter-spacing:1.5px;
}

.newchat{
  width:100%;
  padding:13px;
  text-align:left;
  color:white;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
}

.newchat:hover{
  background:#0c192b;
}

.section-title{
  color:#64738a;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.3px;
  margin:25px 5px 10px;
}

.history{
  flex:1;
  overflow:auto;
}

.empty{
  color:#66758b;
  font-size:13px;
  padding:8px 5px;
}

.history-item{
  width:100%;
  padding:10px;
  border:0;
  background:transparent;
  color:#ccd5e3;
  text-align:left;
  border-radius:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#0c192b;
}

.bottom{
  border-top:1px solid var(--border);
  padding-top:10px;
}

.side-btn{
  width:100%;
  padding:11px 7px;
  border:0;
  background:transparent;
  color:#cbd5e3;
  text-align:left;
  border-radius:8px;
}

.side-btn:hover{
  background:#0c192b;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  margin-left:275px;
  min-height:100vh;
}

.topbar{
  height:64px;
  display:flex;
  align-items:center;
  padding:0 22px;
  border-bottom:1px solid rgba(27,43,66,.75);
  background:rgba(2,8,22,.78);
  backdrop-filter:blur(15px);
  position:sticky;
  top:0;
  z-index:50;
}

.menu{
  display:none;
  border:0;
  background:transparent;
  color:white;
  font-size:25px;
  margin-right:12px;
}

.top-title{
  font-weight:800;
}

.status{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:7px;
  color:#91a0b5;
  font-size:12px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#777;
}

.status-dot.online{
  background:#4ee58a;
  box-shadow:0 0 12px #4ee58a;
}

.status-dot.warning{
  background:#ffc857;
  box-shadow:0 0 10px rgba(255,200,87,.45);
}

.status-dot.error{
  background:#ff6178;
  box-shadow:0 0 10px rgba(255,97,120,.45);
}

/* =========================================================
   HOME
========================================================= */

.container{
  width:min(900px,calc(100% - 28px));
  margin:auto;
  padding:65px 0 120px;
}

.hero{
  text-align:center;
  margin-bottom:25px;
}

.hero-logo{
  width:70px;
  height:70px;
  margin:0 auto 20px;
  display:grid;
  place-items:center;
  border-radius:22px;
  font-size:28px;
  font-weight:900;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  box-shadow:0 0 45px rgba(54,215,255,.15);
}

.hero h1{
  font-size:clamp(34px,7vw,56px);
  letter-spacing:-2px;
  margin-bottom:13px;
}

.hero p{
  color:var(--muted);
  max-width:680px;
  margin:auto;
  line-height:1.65;
  font-size:14px;
}

/* =========================================================
   SEARCH
========================================================= */

.search-box{
  max-width:780px;
  margin:0 auto 28px;
}

.search-container{
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:9px;
  border:1px solid #2a3e5c;
  border-radius:19px;
  background:rgba(7,17,31,.97);
  box-shadow:0 18px 55px rgba(0,0,0,.4);
}

.search-container textarea{
  flex:1;
  min-height:48px;
  max-height:160px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:13px 10px;
  line-height:1.4;
}

.search-container textarea::placeholder{
  color:#64748a;
}

.search-button{
  width:48px;
  height:48px;
  border:0;
  border-radius:14px;
  color:white;
  font-size:21px;
  font-weight:900;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
}

.search-button:hover{
  filter:brightness(1.08);
}

.search-button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.search-hint{
  text-align:center;
  color:#596980;
  font-size:10px;
  margin-top:8px;
}

/* =========================================================
   SEARCH MODES
========================================================= */

.search-modes{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-bottom:32px;
  flex-wrap:wrap;
}

.mode-chip{
  border:1px solid var(--border);
  background:#071120;
  color:#9caabd;
  padding:8px 13px;
  border-radius:20px;
  font-size:11px;
}

.mode-chip:hover{
  background:#0c192b;
}

.mode-chip.active{
  color:white;
  border-color:#5265a0;
  background:#101d35;
}

/* =========================================================
   EXPLORE
========================================================= */

.explore{
  text-align:center;
  color:#aeb9ca;
  font-size:13px;
  margin-bottom:13px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.card{
  min-height:150px;
  text-align:left;
  color:white;
  padding:19px;
  border-radius:17px;
  border:1px solid var(--border);
  background:linear-gradient(180deg,#0a1728,#06101e);
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#415477;
}

.card-icon{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:#101f35;
  margin-bottom:16px;
  font-size:19px;
}

.card h3{
  font-size:14px;
  margin-bottom:7px;
}

.card p{
  color:#8392a8;
  font-size:11px;
  line-height:1.5;
}

/* =========================================================
   RESULTS
========================================================= */

.results{
  display:none;
  max-width:900px;
  margin:35px auto 0;
}

.results.show{
  display:block;
}

.result-header{
  display:flex;
  align-items:center;
  margin-bottom:15px;
}

.result-header h2{
  font-size:20px;
}

.result-header button{
  margin-left:auto;
  border:1px solid var(--border);
  background:#071120;
  color:white;
  padding:8px 11px;
  border-radius:9px;
}

.result-header button:hover{
  background:#0c192b;
}

.answer{
  background:#071120;
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px;
  line-height:1.7;
  overflow-wrap:anywhere;
  font-size:14px;
}

.answer.plain{
  white-space:pre-wrap;
}

.answer.error{
  color:#ff9aaa;
  border-color:#633040;
  background:#180b12;
}

.wait{
  color:#7f8ea5;
  font-size:12px;
  text-align:center;
  margin-top:4px;
}

/* =========================================================
   MARKDOWN
========================================================= */

.md h3,
.md h4,
.md h5{
  margin:18px 0 8px;
  line-height:1.3;
}

.md h3{
  font-size:18px;
}

.md h4{
  font-size:16px;
}

.md h5{
  font-size:14px;
}

.md>:first-child{
  margin-top:0;
}

.md>:last-child{
  margin-bottom:0;
}

.md p{
  margin:0 0 12px;
}

.md ul,
.md ol{
  margin:0 0 12px;
  padding-left:22px;
}

.md li{
  margin:4px 0;
}

.md a{
  color:#9dd7ff;
}

.md strong{
  font-weight:750;
}

.md code{
  background:#0c192b;
  border:1px solid #172a43;
  border-radius:6px;
  padding:1px 5px;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12.5px;
}

.md pre{
  background:#040c18;
  border:1px solid #172a43;
  border-radius:12px;
  padding:14px;
  margin:0 0 12px;
  overflow-x:auto;
}

.md pre code{
  background:none;
  border:0;
  padding:0;
  line-height:1.55;
}

/* =========================================================
   SOURCES
========================================================= */

.sources{
  margin-top:18px;
}

.sources-title{
  font-weight:750;
  margin-bottom:8px;
}

.source{
  display:block;
  text-decoration:none;
  color:#9dd7ff;
  background:#091729;
  border:1px solid #172a43;
  padding:10px;
  border-radius:10px;
  margin:6px 0;
  font-size:11px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.source:hover{
  border-color:#36557c;
  background:#0c1b30;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
  display:flex;
  justify-content:center;
  gap:5px;
  padding:18px;
}

.loading span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#9aa8bd;
  animation:bounce 1s infinite;
}

.loading span:nth-child(2){
  animation-delay:.15s;
}

.loading span:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,80%,100%{
    opacity:.25;
    transform:translateY(0);
  }

  40%{
    opacity:1;
    transform:translateY(-4px);
  }
}

@media(prefers-reduced-motion:reduce){
  html{
    scroll-behavior:auto;
  }

  .loading span{
    animation:none;
    opacity:.7;
  }

  .card,
  .sidebar{
    transition:none;
  }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
    box-shadow:20px 0 50px rgba(0,0,0,.5);
  }

  .main{
    margin-left:0;
  }

  .menu{
    display:block;
  }

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .container{
    padding-top:45px;
  }
}

@media(max-width:520px){

  .topbar{
    padding:0 14px;
  }

  .container{
    width:calc(100% - 18px);
    padding-top:35px;
  }

  .hero h1{
    font-size:39px;
  }

  .hero p{
    font-size:13px;
  }

  .search-container{
    border-radius:16px;
  }

  .cards{
    gap:8px;
  }

  .card{
    min-height:145px;
    padding:15px;
  }

  .card h3{
    font-size:13px;
  }

  .answer{
    padding:15px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       SIDEBAR
  ====================================================== -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">X</div>

      <div>
        <strong>ARC X</strong>
        <small>AI SUPER APP</small>
      </div>
    </div>

    <button class="newchat" onclick="newChat()">
      ＋ &nbsp; New chat
    </button>

    <div class="section-title">
      Recent chats
    </div>

    <div class="history" id="history">
      <div class="empty">
        No recent chats
      </div>
    </div>

    <div class="bottom">

      <button class="side-btn" onclick="toggleAppearance()">
        ◐ &nbsp; Appearance
      </button>

      <button class="side-btn" onclick="clearHistory()">
        ⌫ &nbsp; Clear history
      </button>

    </div>

  </aside>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="main">

    <header class="topbar">

      <button
        class="menu"
        onclick="toggleSidebar()"
        aria-label="Open menu"
      >
        ☰
      </button>

      <div class="top-title">
        ARC X
      </div>

      <div class="status">

        <span
          class="status-dot"
          id="statusDot"
        ></span>

        <span id="statusText">
          Connecting...
        </span>

      </div>

    </header>


    <div class="container">

      <!-- =================================================
           HERO
      ================================================== -->

      <section class="hero">

        <div class="hero-logo">
          X
        </div>

        <h1>
          Welcome to ARC X
        </h1>

        <p>
          Search the web, research topics, understand information,
          create content, code and explore ideas with ARC X.
        </p>

      </section>


      <!-- =================================================
           SEARCH BOX
      ================================================== -->

      <section class="search-box">

        <div class="search-container">

          <textarea
            id="mainInput"
            rows="1"
            placeholder="Search the web..."
            onkeydown="handleSearchKey(event)"
            aria-label="Ask ARC X"
          ></textarea>

          <button
            class="search-button"
            id="searchButton"
            onclick="runSearch()"
            aria-label="Search"
          >
            ↑
          </button>

        </div>

        <div class="search-hint">
          Enter to search · Shift + Enter for a new line
        </div>

      </section>


      <!-- =================================================
           SEARCH MODES
      ================================================== -->

      <div class="search-modes">

        <button
          class="mode-chip active"
          id="chipWeb"
          onclick="setSearchMode('web')"
        >
          ⌕ Web Search
        </button>

        <button
          class="mode-chip"
          id="chipAI"
          onclick="setSearchMode('ai')"
        >
          ✦ AI Chat
        </button>

        <button
          class="mode-chip"
          id="chipResearch"
          onclick="setSearchMode('research')"
        >
          ◉ Deep Research
        </button>

      </div>


      <!-- =================================================
           EXPLORE
      ================================================== -->

      <div class="explore">
        Explore ARC X
      </div>

      <div class="cards">

        <button
          class="card"
          onclick="selectMode('web')"
        >

          <div class="card-icon">
            ⌕
          </div>

          <h3>
            Web Search
          </h3>

          <p>
            Find current information from the web.
          </p>

        </button>


        <button
          class="card"
          onclick="selectMode('research')"
        >

          <div class="card-icon">
            ◉
          </div>

          <h3>
            Deep Research
          </h3>

          <p>
            Research topics using multiple sources.
          </p>

        </button>


        <button
          class="card"
          onclick="selectMode('create')"
        >

          <div class="card-icon">
            ✦
          </div>

          <h3>
            Create
          </h3>

          <p>
            Write posts, scripts and documents.
          </p>

        </button>


        <button
          class="card"
          onclick="selectMode('code')"
        >

          <div class="card-icon">
            &lt;/&gt;
          </div>

          <h3>
            Code
          </h3>

          <p>
            Build and understand software.
          </p>

        </button>

      </div>


      <!-- =================================================
           RESULTS
      ================================================== -->

      <section
        class="results"
        id="results"
      >

        <div class="result-header">

          <h2 id="resultTitle">
            ARC X
          </h2>

          <button onclick="clearResults()">
            New search
          </button>

        </div>

        <div id="resultContent"></div>

      </section>

    </div>

  </main>

</div>


<script>

/* =========================================================
   ARC X STATE
========================================================= */

let searchMode = "web";

let history = [];

const mainInput =
  document.getElementById("mainInput");

const searchButton =
  document.getElementById("searchButton");

const results =
  document.getElementById("results");

const resultContent =
  document.getElementById("resultContent");

const resultTitle =
  document.getElementById("resultTitle");

const historyEl =
  document.getElementById("history");

const sidebar =
  document.getElementById("sidebar");

const statusDot =
  document.getElementById("statusDot");

const statusText =
  document.getElementById("statusText");


/* =========================================================
   MODE
========================================================= */

function setSearchMode(mode){

  searchMode = mode;

  document
    .querySelectorAll(".mode-chip")
    .forEach(function(button){
      button.classList.remove("active");
    });

  if(mode === "web"){

    document
      .getElementById("chipWeb")
      .classList.add("active");

    mainInput.placeholder =
      "Search the web...";

  }
  else if(mode === "ai"){

    document
      .getElementById("chipAI")
      .classList.add("active");

    mainInput.placeholder =
      "Ask ARC X anything...";

  }
  else if(mode === "research"){

    document
      .getElementById("chipResearch")
      .classList.add("active");

    mainInput.placeholder =
      "What should ARC X research?";

  }

  mainInput.focus();
}


/* =========================================================
   EXPLORE CARDS
========================================================= */

function selectMode(mode){

  if(
    mode === "web" ||
    mode === "research"
  ){

    setSearchMode(mode);

    mainInput.focus();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

    return;
  }

  if(mode === "create"){

    setSearchMode("ai");

    mainInput.placeholder =
      "What do you want ARC X to create?";

    mainInput.focus();

    return;
  }

  if(mode === "code"){

    setSearchMode("ai");

    mainInput.placeholder =
      "Describe the code you need...";

    mainInput.focus();

  }
}


/* =========================================================
   SEARCH
========================================================= */

async function runSearch(){

  const query =
    mainInput.value.trim();

  if(!query){

    mainInput.focus();

    return;
  }

  if(searchButton.disabled){
    return;
  }

  searchButton.disabled = true;

  results.classList.add("show");

  resultTitle.textContent =
    searchMode === "web"
      ? "Web Search"
      : searchMode === "research"
      ? "Deep Research"
      : "ARC X";

  resultContent.innerHTML = `
    <div class="answer">
      <div class="loading">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="wait">
        Working on it. The first request after a break can take up to a minute.
      </div>
    </div>
  `;

  try{

    let endpoint;
    let requestBody;

    if(searchMode === "web"){

      endpoint = "/api/search-answer";

      requestBody = {
        query:query
      };

    }
    else if(searchMode === "research"){

      endpoint = "/api/research";

      requestBody = {
        query:query
      };

    }
    else{

      endpoint = "/api/chat";

      requestBody = {
        message:query
      };

    }
