<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARC X — AI Search</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #202731;
      background: #0b0f14;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: #6ea8fe;
    }

    .menu {
      font-size: 25px;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 55px 18px 40px;
    }

    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .hero h1 span {
      color: #6ea8fe;
    }

    .hero p {
      color: #9ca6b3;
      font-size: 16px;
    }

    .search-box {
      background: #151b23;
      border: 1px solid #2a3441;
      border-radius: 18px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 35px #0004;
    }

    textarea {
      flex: 1;
      min-height: 55px;
      max-height: 180px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #ffffff;
      font-size: 16px;
      padding: 15px;
      font-family: inherit;
    }

    textarea::placeholder {
      color: #7f8996;
    }

    #searchBtn {
      border: 0;
      border-radius: 13px;
      background: #ffffff;
      color: #080b10;
      font-weight: 700;
      padding: 13px 17px;
      cursor: pointer;
      min-width: 82px;
    }

    #searchBtn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .quick {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 16px;
    }

    .quick button {
      background: #121820;
      color: #b9c2ce;
      border: 1px solid #28323e;
      border-radius: 20px;
      padding: 8px 13px;
      cursor: pointer;
    }

    #loading {
      display: none;
      text-align: center;
      margin: 35px 0;
      color: #9ca6b3;
    }

    .spinner {
      width: 25px;
      height: 25px;
      border: 3px solid #303945;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #result {
      display: none;
      margin-top: 35px;
    }

    .answer-card {
      background: #11171f;
      border: 1px solid #252f3b;
      border-radius: 18px;
      padding: 22px;
      line-height: 1.7;
    }

    .answer-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    #answer {
      color: #e7ebf0;
      white-space: pre-wrap;
      font-size: 16px;
    }

    .sources {
      margin-top: 22px;
    }

    .sources h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .source {
      display: block;
      background: #11171f;
      color: #dce3eb;
      border: 1px solid #252f3b;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 9px;
      text-decoration: none;
    }

    .source:hover {
      border-color: #6ea8fe;
    }

    .source-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .source-url {
      color: #7f8996;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #error {
      display: none;
      margin-top: 25px;
      padding: 15px;
      border: 1px solid #6b3030;
      background: #251416;
      border-radius: 12px;
      color: #ffb4b4;
    }

    @media (max-width: 600px) {
      main {
        padding-top: 35px;
      }

      .hero h1 {
        font-size: 31px;
      }

      .search-box {
        flex-direction: column;
        align-items: stretch;
      }

      #searchBtn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      ARC <span>X</span>
    </div>

    <div class="menu">
      ☰
    </div>
  </header>

  <main>

    <section class="hero">
      <h1>
        Ask <span>ARC X</span>
      </h1>

      <p>
        AI answers powered by live web search and intelligent research.
      </p>
    </section>

    <div class="search-box">

      <textarea
        id="question"
        placeholder="Ask anything..."
        rows="2"
      ></textarea>

      <button id="searchBtn">
        Search
      </button>

    </div>

    <div class="quick">

      <button data-q="What are the latest AI developments?">
        Latest AI
      </button>

      <button data-q="Explain quantum computing simply">
        Explain something
      </button>

      <button data-q="What are today's biggest technology trends?">
        Tech trends
      </button>

    </div>

    <div id="loading">

      <div class="spinner"></div>

      <div>
        ARC X is searching the web and thinking...
      </div>

    </div>

    <div id="error"></div>

    <section id="result">

      <div class="answer-card">

        <div class="answer-title">
          ARC X Answer
        </div>

        <div id="answer"></div>

      </div>

      <div class="sources">

        <h2>
          Sources
        </h2>

        <div id="sourcesList"></div>

      </div>

    </section>

  </main>

  <script>

    const question =
      document.getElementById("question");

    const searchBtn =
      document.getElementById("searchBtn");

    const loading =
      document.getElementById("loading");

    const result =
      document.getElementById("result");

    const answer =
      document.getElementById("answer");

    const sourcesList =
      document.getElementById("sourcesList");

    const errorBox =
      document.getElementById("error");


    function escapeHtml(value) {

      return String(value).replace(
        /[&<>"']/g,
        function (character) {

          const entities = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          };

          return entities[character];
        }
      );

    }


    function showError(message) {

      errorBox.textContent = message;

      errorBox.style.display = "block";

    }


    async function search() {

      const q = question.value.trim();

      if (!q) {
        return;
      }


      searchBtn.disabled = true;

      loading.style.display = "block";

      result.style.display = "none";

      errorBox.style.display = "none";

      answer.textContent = "";

      sourcesList.innerHTML = "";


      try {

        const response = await fetch(
          "/api/search",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              question: q
            })
          }
        );


        const data =
          await response.json()
          .catch(function () {
            return {
              error: "Invalid server response."
            };
          });


        if (!response.ok) {

          throw new Error(
            data.error ||
            "ARC X could not complete the search."
          );

        }


        answer.textContent =
          data.answer ||
          "No answer returned.";


        (data.sources || []).forEach(
          function (src) {

            const link =
              document.createElement("a");

            link.className = "source";

            link.href =
              src.url || "#";

            link.target = "_blank";

            link.rel =
              "noopener noreferrer";


            link.innerHTML =
              '<div class="source-title">' +
              "[" +
              escapeHtml(src.id || "") +
              "] " +
              escapeHtml(
                src.title || "Source"
              ) +
              "</div>" +

              '<div class="source-url">' +
              escapeHtml(
                src.url || ""
              ) +
              "</div>";


            sourcesList.appendChild(link);

          }
        );


        result.style.display = "block";

      }

      catch (error) {

        showError(
          error.message ||
          "Something went wrong."
        );

      }

      finally {

        loading.style.display = "none";

        searchBtn.disabled = false;

      }

    }


    searchBtn.addEventListener(
      "click",
      search
    );


    question.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          search();

        }

      }
    );


    document
      .querySelectorAll(".quick button")
      .forEach(
        function (button) {

          button.addEventListener(
            "click",
            function () {

              question.value =
                button.dataset.q;

              search();

            }
          );

        }
      );

  </script>

</body>
                             </html>
