<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020816">
<meta name="description" content="ARC X — AI Super App">
<title>ARC X — AI Super App</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#020816;
  --bg2:#050d1b;
  --panel:#071120;
  --panel2:#0b1728;
  --panel3:#0e1b2f;
  --border:#1b2b42;
  --border2:#263b58;
  --text:#f5f7fb;
  --muted:#91a0b5;
  --muted2:#65758c;
  --blue:#6676ff;
  --cyan:#36d7ff;
  --green:#4ee58a;
  --red:#ff6178;
  --yellow:#ffc857;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(54,215,255,.13),
      transparent 35%
    ),
    radial-gradient(
      circle at 100% 30%,
      rgba(102,118,255,.07),
      transparent 30%
    ),
    var(--bg);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button:focus-visible,
textarea:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:2px;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:275px;
  padding:18px;
  z-index:100;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(
      180deg,
      #040c18,
      #030916
    );
  border-right:1px solid var(--border);
  transition:transform .25s ease;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.logo{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:13px;
  color:white;
  font-weight:950;
  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--cyan)
    );
  box-shadow:
    0 8px 25px rgba(54,215,255,.12);
}

.brand strong{
  display:block;
  font-size:15px;
}

.brand small{
  display:block;
  margin-top:2px;
  color:var(--muted2);
  font-size:9px;
  letter-spacing:1.6px;
}

.newchat{
  width:100%;
  border:1px solid var(--border2);
  border-radius:13px;
  padding:13px;
  color:white;
  text-align:left;
  background:
    linear-gradient(
      135deg,
      rgba(102,118,255,.10),
      rgba(54,215,255,.05)
    );
  transition:.2s;
}

.newchat:hover{
  border-color:#52658b;
  transform:translateY(-1px);
}

.section-title{
  margin:25px 5px 10px;
  color:#64738a;
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.history{
  flex:1;
  overflow-y:auto;
  scrollbar-width:thin;
}

.empty{
  padding:9px 5px;
  color:#66758b;
  font-size:12px;
}

.history-item{
  width:100%;
  padding:10px;
  margin-bottom:3px;
  border:0;
  border-radius:9px;
  color:#ccd5e3;
  background:transparent;
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#0c192b;
}

.bottom{
  padding-top:10px;
  border-top:1px solid var(--border);
}

.side-btn{
  width:100%;
  padding:11px 7px;
  border:0;
  border-radius:9px;
  color:#cbd5e3;
  background:transparent;
  text-align:left;
}

.side-btn:hover{
  background:#0c192b;
}

/* =========================
   MAIN
========================= */

.main{
  min-height:100vh;
  margin-left:275px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:64px;
  display:flex;
  align-items:center;
  padding:0 22px;
  border-bottom:1px solid rgba(27,43,66,.75);
  background:rgba(2,8,22,.78);
  backdrop-filter:blur(18px);
}

.menu{
  display:none;
  margin-right:12px;
  padding:3px;
  border:0;
  color:white;
  background:transparent;
  font-size:25px;
}

.top-title{
  font-size:15px;
  font-weight:850;
  letter-spacing:.2px;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  margin-left:auto;
  color:var(--muted);
  font-size:11px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#777;
}

.status-dot.online{
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}

.status-dot.warning{
  background:var(--yellow);
  box-shadow:0 0 10px rgba(255,200,87,.4);
}

.status-dot.error{
  background:var(--red);
  box-shadow:0 0 10px rgba(255,97,120,.4);
}

/* =========================
   MAIN CONTAINER
========================= */

.container{
  width:min(920px,calc(100% - 28px));
  margin:auto;
  padding:68px 0 120px;
}

/* =========================
   HERO
========================= */

.hero{
  margin-bottom:28px;
  text-align:center;
}

.hero-logo{
  width:76px;
  height:76px;
  display:grid;
  place-items:center;
  margin:0 auto 20px;
  border-radius:24px;
  color:white;
  font-size:30px;
  font-weight:950;
  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--cyan)
    );
  box-shadow:
    0 0 55px rgba(54,215,255,.16);
}

.hero h1{
  margin-bottom:13px;
  font-size:clamp(36px,7vw,58px);
  line-height:1.05;
  letter-spacing:-2.5px;
}

.hero p{
  max-width:690px;
  margin:auto;
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

/* =========================
   SEARCH
========================= */

.search-box{
  max-width:800px;
  margin:0 auto 13px;
}

.search-container{
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:9px;
  border:1px solid #2b4160;
  border-radius:20px;
  background:
    linear-gradient(
      180deg,
      rgba(9,20,36,.98),
      rgba(5,14,27,.98)
    );
  box-shadow:
    0 20px 60px rgba(0,0,0,.38);
  transition:border-color .2s,box-shadow .2s;
}

.search-container:focus-within{
  border-color:#47648e;
  box-shadow:
    0 20px 60px rgba(0,0,0,.4),
    0 0 0 3px rgba(54,215,255,.05);
}

.search-container textarea{
  width:100%;
  min-height:48px;
  max-height:170px;
  resize:none;
  padding:13px 10px;
  border:0;
  outline:0;
  color:white;
  background:transparent;
  line-height:1.45;
}

.search-container textarea::placeholder{
  color:#64748a;
}

.search-button{
  flex:0 0 48px;
  width:48px;
  height:48px;
  border:0;
  border-radius:14px;
  color:white;
  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--cyan)
    );
  font-size:21px;
  font-weight:950;
  transition:.2s;
}

.search-button:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.search-button:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

.search-hint{
  margin-top:8px;
  color:#596980;
  text-align:center;
  font-size:10px;
}

/* =========================
   MODE CHIPS
========================= */

.search-modes{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin:18px 0 34px;
}

.mode-chip{
  padding:8px 13px;
  border:1px solid var(--border);
  border-radius:20px;
  color:#9caabd;
  background:#071120;
  font-size:11px;
  transition:.2s;
}

.mode-chip:hover{
  border-color:#3b5273;
  background:#0c192b;
}

.mode-chip.active{
  color:white;
  border-color:#5265a0;
  background:
    linear-gradient(
      135deg,
      #111c36,
      #10223a
    );
}

/* =========================
   EXPLORE
========================= */

.explore{
  margin-bottom:13px;
  color:#aeb9ca;
  text-align:center;
  font-size:13px;
  font-weight:650;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.card{
  min-height:158px;
  padding:19px;
  border:1px solid var(--border);
  border-radius:18px;
  color:white;
  background:
    linear-gradient(
      180deg,
      #0a1728,
      #06101e
    );
  text-align:left;
  transition:
    transform .2s,
    border-color .2s,
    box-shadow .2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#415477;
  box-shadow:0 15px 35px rgba(0,0,0,.22);
}

.card-icon{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  margin-bottom:17px;
  border-radius:12px;
  color:#dce8ff;
  background:#101f35;
  font-size:19px;
}

.card h3{
  margin-bottom:7px;
  font-size:14px;
}

.card p{
  color:#8392a8;
  font-size:11px;
  line-height:1.55;
}

/* =========================
   RESULTS
========================= */

.results{
  display:none;
  margin:38px auto 0;
}

.results.show{
  display:block;
}

.result-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.result-header h2{
  font-size:20px;
  letter-spacing:-.3px;
}

.result-actions{
  display:flex;
  gap:7px;
  margin-left:auto;
}

.result-action{
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:9px;
  color:white;
  background:#071120;
  font-size:11px;
}

.result-action:hover{
  background:#0c192b;
}

.answer{
  padding:19px;
  border:1px solid var(--border);
  border-radius:18px;
  color:#e7ecf5;
  background:
    linear-gradient(
      180deg,
      #071120,
      #06101e
    );
  font-size:14px;
  line-height:1.75;
  overflow-wrap:anywhere;
}

.answer.error{
  color:#ff9aaa;
  border-color:#633040;
  background:#180b12;
}

.wait{
  margin-top:4px;
  color:#7f8ea5;
  text-align:center;
  font-size:12px;
}

/* =========================
   MARKDOWN
========================= */

.md h1,
.md h2,
.md h3,
.md h4{
  margin:18px 0 9px;
  line-height:1.3;
}

.md h1{
  font-size:24px;
}

.md h2{
  font-size:20px;
}

.md h3{
  font-size:18px;
}

.md h4{
  font-size:16px;
}

.md p{
  margin:0 0 13px;
}

.md ul,
.md ol{
  margin:0 0 13px;
  padding-left:23px;
}

.md li{
  margin:5px 0;
}

.md strong{
  font-weight:800;
}

.md code{
  padding:2px 5px;
  border:1px solid #172a43;
  border-radius:6px;
  color:#d9ecff;
  background:#0c192b;
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;
  font-size:12px;
}

.md pre{
  margin:0 0 14px;
  padding:14px;
  overflow-x:auto;
  border:1px solid #172a43;
  border-radius:12px;
  background:#040c18;
}

.md pre code{
  padding:0;
  border:0;
  background:transparent;
  line-height:1.55;
}

/* =========================
   SOURCES
========================= */

.sources{
  margin-top:18px;
}

.sources-title{
  margin-bottom:8px;
  color:#cbd6e7;
  font-size:13px;
  font-weight:750;
}

.source{
  display:block;
  margin:6px 0;
  padding:11px;
  overflow:hidden;
  border:1px solid #172a43;
  border-radius:11px;
  color:#9dd7ff;
  background:#091729;
  text-decoration:none;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:11px;
}

.source:hover{
  border-color:#36557c;
  background:#0c1b30;
}

/* =========================
   LOADING
========================= */

.loading{
  display:flex;
  justify-content:center;
  gap:6px;
  padding:20px 0 10px;
}

.loading span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#9aa8bd;
  animation:arcBounce 1s infinite;
}

.loading span:nth-child(2){
  animation-delay:.15s;
}

.loading span:nth-child(3){
  animation-delay:.30s;
}

@keyframes arcBounce{
  0%,80%,100%{
    opacity:.25;
    transform:translateY(0);
  }

  40%{
    opacity:1;
    transform:translateY(-5px);
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){

  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
    box-shadow:20px 0 55px rgba(0,0,0,.55);
  }

  .main{
    margin-left:0;
  }

  .menu{
    display:block;
  }

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .container{
    padding-top:46px;
  }
}

@media(max-width:520px){

  .topbar{
    height:58px;
    padding:0 14px;
  }

  .container{
    width:calc(100% - 18px);
    padding-top:35px;
  }

  .hero-logo{
    width:68px;
    height:68px;
    border-radius:20px;
  }

  .hero h1{
    font-size:39px;
  }

  .hero p{
    font-size:13px;
  }

  .search-container{
    border-radius:17px;
  }

  .search-button{
    width:46px;
    height:46px;
    flex-basis:46px;
  }

  .cards{
    gap:8px;
  }

  .card{
    min-height:148px;
    padding:15px;
  }

  .card h3{
    font-size:13px;
  }

  .card p{
    font-size:10.5px;
  }

  .answer{
    padding:15px;
    font-size:13px;
  }

  .result-actions{
    gap:5px;
  }

  .result-action{
    padding:7px 8px;
  }
}
</style>
</head>

<body>

<script>
"use strict";

/* =========================================================
   ARC X CORE
========================================================= */

var searchMode = "web";
var history = [];
var lastAnswer = "";


/* DOM */

var mainInput =
  document.getElementById("mainInput");

var searchButton =
  document.getElementById("searchButton");

var results =
  document.getElementById("results");

var resultContent =
  document.getElementById("resultContent");

var resultTitle =
  document.getElementById("resultTitle");

var historyEl =
  document.getElementById("history");

var sidebar =
  document.getElementById("sidebar");

var statusDot =
  document.getElementById("statusDot");

var statusText =
  document.getElementById("statusText");

var copyButton =
  document.getElementById("copyButton");


/* =========================================================
   STATUS
========================================================= */

function setStatus(text,type){

  statusText.textContent = text;

  statusDot.className =
    "status-dot";

  if(type){
    statusDot.classList.add(type);
  }

}


/* =========================================================
   SERVER HEALTH
========================================================= */

async function checkHealth(){

  setStatus(
    "Connecting...",
    ""
  );

  try{

    var response =
      await fetch(
        "/api/health?x=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Server returned HTTP " +
        response.status
      );

    }


    var data =
      await response.json();


    if(data.ok){

      setStatus(
        "Connected",
        "online"
      );

    }else{

      setStatus(
        "Server issue",
        "warning"
      );

    }


  }catch(error){

    console.error(
      "Health check:",
      error
    );

    setStatus(
      "Disconnected",
      "error"
    );

  }

}


/* =========================================================
   HISTORY
========================================================= */

function loadHistory(){

  try{

    var saved =
      localStorage.getItem(
        "arcx_history"
      );


    if(saved){

      var parsed =
        JSON.parse(saved);


      if(Array.isArray(parsed)){

        history = parsed;

      }

    }

  }catch(error){

    console.warn(
      "History error:",
      error
    );

  }


  renderHistory();

}


function saveHistory(){

  try{

    localStorage.setItem(
      "arcx_history",
      JSON.stringify(
        history.slice(0,30)
      )
    );

  }catch(error){

    console.warn(
      "Could not save history",
      error
    );

  }

}


function addHistory(query,mode){

  history.unshift({

    query:query,

    mode:mode,

    time:Date.now()

  });


  var unique = [];


  history.forEach(function(item){

    var exists =
      unique.some(function(existing){

        return (
          existing.query === item.query &&
          existing.mode === item.mode
        );

      });


    if(!exists){

      unique.push(item);

    }

  });


  history =
    unique.slice(0,30);


  saveHistory();

  renderHistory();

}


function renderHistory(){

  historyEl.innerHTML = "";


  if(!history.length){

    var empty =
      document.createElement("div");

    empty.className = "empty";

    empty.textContent =
      "No recent chats";

    historyEl.appendChild(empty);

    return;

  }


  history.forEach(function(item){

    var button =
      document.createElement("button");


    button.className =
      "history-item";


    button.textContent =
      item.query;


    button.title =
      item.query;


    button.addEventListener(
      "click",
      function(){

        mainInput.value =
          item.query;


        setSearchMode(
          item.mode || "web"
        );


        runSearch();


        if(window.innerWidth <= 850){

          sidebar.classList.remove(
            "open"
          );

        }

      }
    );


    historyEl.appendChild(button);

  });

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   SIMPLE MARKDOWN RENDERER
========================================================= */

function renderMarkdown(text){

  if(!text){
    return "";
  }

  var source = String(text);

  var codeBlocks = [];

  source = source.replace(
    /```([\w+-]*)\n?([\s\S]*?)```/g,
    function(match,language,code){

      var index = codeBlocks.length;

      codeBlocks.push({
        language: language || "",
        code: code.trim()
      });

      return "___ARCX_CODE_BLOCK_" + index + "___";

    }
  );

  source = escapeHTML(source);

  source = source.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
  );

  source = source.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );

  source = source.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );

  source = source.replace(
    /\*(.*?)\*/g,
    "<em>$1</em>"
  );

  source = source.replace(
    /^### (.+)$/gm,
    "<h4>$1</h4>"
  );

  source = source.replace(
    /^## (.+)$/gm,
    "<h3>$1</h3>"
  );

  source = source.replace(
    /^# (.+)$/gm,
    "<h2>$1</h2>"
  );

  source = source.replace(
    /^[-•] (.+)$/gm,
    "<li>$1</li>"
  );

  source = source.replace(
    /(<li>.*<\/li>)/g,
    "<ul>$1</ul>"
  );

  source = source.replace(
    /^\d+\.\s(.+)$/gm,
    "<li>$1</li>"
  );

  source = source.replace(
    /\n{2,}/g,
    "</p><p>"
  );

  source = source.replace(
    /\n/g,
    "<br>"
  );

  source = "<p>" + source + "</p>";

  source = source.replace(
    /<p>\s*(<h[234]>)/g,
    "$1"
  );

  source = source.replace(
    /(<\/h[234]>)\s*<\/p>/g,
    "$1"
  );

  source = source.replace(
    /<p>\s*(<ul>)/g,
    "$1"
  );

  source = source.replace(
    /(<\/ul>)\s*<\/p>/g,
    "$1"
  );

  codeBlocks.forEach(function(block,index){

    var placeholder =
      "___ARCX_CODE_BLOCK_" + index + "___";

    var html =
      '<div class="code-block">';

    if(block.language){

      html +=
        '<div class="code-header">' +
        '<span>' +
        escapeHTML(block.language) +
        '</span>' +
        '<button type="button" class="copy-code" data-code="' +
        encodeURIComponent(block.code) +
        '">Copy</button>' +
        '</div>';

    }

    html +=
      "<pre><code>" +
      escapeHTML(block.code) +
      "</code></pre>" +
      "</div>";

    source = source.replace(
      placeholder,
      html
    );

  });

  return source;

}


/* =========================================================
   EXTRACT ANSWER
========================================================= */

function extractAnswer(data){

  if(!data){
    return "";
  }

  if(typeof data === "string"){
    return data;
  }

  var possibleFields = [

    "answer",
    "response",
    "content",
    "text",
    "message",
    "result",
    "output"

  ];

  for(var i = 0; i < possibleFields.length; i++){

    var field = possibleFields[i];

    if(
      data[field] !== undefined &&
      data[field] !== null &&
      String(data[field]).trim()
    ){

      return String(data[field]);

    }

  }

  if(data.choices && Array.isArray(data.choices)){

    if(data.choices[0]){

      if(data.choices[0].message){

        return data.choices[0].message.content || "";

      }

      if(data.choices[0].text){

        return data.choices[0].text;

      }

    }

  }

  return "";

}


/* =========================================================
   EXTRACT SOURCES
========================================================= */

function extractSources(data){

  if(!data || typeof data !== "object"){
    return [];
  }

  var sources =
    data.sources ||
    data.citations ||
    data.results ||
    [];

  if(!Array.isArray(sources)){
    return [];
  }

  return sources;

}


/* =========================================================
   RENDER SOURCES
========================================================= */

function renderSources(sources){

  if(!sources || !sources.length){
    return "";
  }

  var html =
    '<div class="sources-section">' +
    '<div class="sources-title">' +
    '<span>Sources</span>' +
    '<span>' + sources.length + "</span>" +
    "</div>" +
    '<div class="sources-list">';

  sources.forEach(function(source,index){

    var url =
      typeof source === "string"
        ? source
        : (
            source.url ||
            source.link ||
            source.href ||
            ""
          );

    var title =
      typeof source === "string"
        ? source
        : (
            source.title ||
            source.name ||
            "Source " + (index + 1)
          );

    var snippet =
      typeof source === "object"
        ? (
            source.snippet ||
            source.description ||
            ""
          )
        : "";

    if(!url){
      return;
    }

    html +=
      '<a class="source-card" href="' +
      escapeHTML(url) +
      '" target="_blank" rel="noopener noreferrer">' +

      '<div class="source-number">' +
      (index + 1) +
      "</div>" +

      '<div class="source-info">' +

      '<div class="source-name">' +
      escapeHTML(title) +
      "</div>" +

      (
        snippet
          ? '<div class="source-snippet">' +
            escapeHTML(snippet) +
            "</div>"
          : ""
      ) +

      '<div class="source-url">' +
      escapeHTML(url) +
      "</div>" +

      "</div>" +

      '<div class="source-arrow">↗</div>' +

      "</a>";

  });

  html +=
    "</div>" +
    "</div>";

  return html;

}


/* =========================================================
   SHOW RESULT
========================================================= */

function showResult(query,data,mode){

  var answer = extractAnswer(data);

  var sources = extractSources(data);

  if(!answer){

    answer =
      "ARC X received a response, but no readable answer was returned by the server.";

  }

  var modeNames = {

    web: "Web Search",

    ai: "AI Chat",

    research: "Deep Research",

    create: "Create",

    code: "Code"

  };

  if(resultTitle){

    resultTitle.textContent =
      modeNames[mode] || "ARC X Answer";

  }

  if(resultContent){

    resultContent.innerHTML =
      '<div class="answer-query">' +
      escapeHTML(query) +
      "</div>" +

      '<div class="answer-body">' +
      renderMarkdown(answer) +
      "</div>" +

      renderSources(sources);

  }

  if(results){

    results.classList.add("visible");

    results.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }

}

function showLoading(query,mode){

/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(url,body){

  var controller =
    new AbortController();

  var timeout =
    setTimeout(function(){

      controller.abort();

    },90000);

  try{

    var response =
      await fetch(url,{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify(body),

        signal:controller.signal

      });

    var text =
      await response.text();

    var data;

    try{

      data =
        text ? JSON.parse(text) : {};

    }catch(error){

      data = {
        answer:text
      };

    }

    if(!response.ok){

      var errorMessage =
        extractAnswer(data) ||
        data.error ||
        data.message ||
        ("Server error " + response.status);

      throw new Error(errorMessage);

    }

    return data;

  }catch(error){

    if(error.name === "AbortError"){

      throw new Error(
        "The request took too long. Render may be waking up. Please try again."
      );

    }

    throw error;

  }finally{

    clearTimeout(timeout);

  }

}


/* =========================================================
   SEARCH
========================================================= */

async function performSearch(){

  var query =
    mainInput
      ? mainInput.value.trim()
      : "";

  if(!query){

    showToast("Type something first");

    if(mainInput){
      mainInput.focus();
    }

    return;

  }

  var mode = searchMode;

  var endpoints = {

    web:{
      url:"/api/search-answer",
      body:{query:query}
    },

    ai:{
      url:"/api/chat",
      body:{message:query}
    },

    research:{
      url:"/api/research",
      body:{query:query}
    },

    create:{
      url:"/api/create",
      body:{prompt:query}
    },

    code:{
      url:"/api/code",
      body:{prompt:query}
    }

  };

  var config =
    endpoints[mode] || endpoints.web;

  if(searchButton){

    searchButton.disabled = true;

    searchButton.classList.add("loading");

  }

  showLoading(query,mode);

  try{

    var data =
      await apiRequest(
        config.url,
        config.body
      );

    showResult(
      query,
      data,
      mode
    );

    addHistory(
      query,
      mode
    );

  }catch(error){

    if(resultContent){

      resultContent.innerHTML =

        '<div class="error-box">' +

        '<div class="error-icon">!</div>' +

        '<div>' +

        "<strong>ARC X couldn't complete that request.</strong>" +

        "<p>" +
        escapeHTML(
          error.message ||
          "Unknown server error."
        ) +
        "</p>" +

        '<button type="button" id="retryButton">Try again</button>' +

        "</div>" +

        "</div>";

    }

    if(results){
      results.classList.add("visible");
    }

    var retryButton =
      document.getElementById("retryButton");

    if(retryButton){

      retryButton.addEventListener(
        "click",
        performSearch
      );

    }

  }finally{

    if(searchButton){

      searchButton.disabled = false;

      searchButton.classList.remove("loading");

    }

  }

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

  var oldToast =
    document.querySelector(".arcx-toast");

  if(oldToast){
    oldToast.remove();
  }

  var toast =
    document.createElement("div");

  toast.className =
    "arcx-toast";

  toast.textContent =
    message;

  document.body.appendChild(toast);

  requestAnimationFrame(function(){

    toast.classList.add("show");

  });

  setTimeout(function(){

    toast.classList.remove("show");

    setTimeout(function(){

      toast.remove();

    },250);

  },2200);

}


/* =========================================================
   COPY TEXT
========================================================= */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(text);

    showToast("Copied to clipboard");

  }catch(error){

    var area =
      document.createElement("textarea");

    area.value = text;

    document.body.appendChild(area);

    area.select();

    document.execCommand("copy");

    area.remove();

    showToast("Copied to clipboard");

  }

}

/* =========================================================
   HEALTH CHECK
========================================================= */

async function checkHealth(){

  try{

    var response =
      await fetch(
        "/api/health",
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "Server returned " +
        response.status
      );

    }

    var data =
      await response.json();

    if(data.groqConfigured === false ||
       data.tavilyConfigured === false){

      setStatus(
        "API keys missing",
        "warning"
      );

    }else{

      setStatus(
        "Connected",
        "success"
      );

    }

  }catch(error){

    setStatus(
      "Disconnected",
      "error"
    );

  }

}


/* =========================================================
   INITIALIZE
========================================================= */

function initializeARCX(){

  loadAppearance();

  loadHistory();

  setSearchMode("web");

  setStatus(
    "Connecting...",
    "loading"
  );

  checkHealth();

  setInterval(
    checkHealth,
    45000
  );

  if(mainInput){

    setTimeout(
      function(){

        mainInput.focus();

      },
      400
    );

  }

}


/* =========================================================
   START ARC X
========================================================= */

if(document.readyState === "loading"){

  document.addEventListener(
    "DOMContentLoaded",
    initializeARCX
  );

}else{

  initializeARCX();

}
