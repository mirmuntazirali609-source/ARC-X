<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f">
<title>ARC-X — AI Search & Intelligence</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#0b0b0f;
color:#f5f5f5;
}

body{overflow:hidden}
button,textarea,select{font:inherit}
button{cursor:pointer}

.app{
width:100%;
height:100vh;
display:flex;
position:relative;
overflow:hidden;
}

.sidebar{
width:270px;
height:100%;
background:#111116;
border-right:1px solid #24242c;
padding:14px;
display:flex;
flex-direction:column;
z-index:20;
transition:transform .25s ease;
}

.brand{
display:flex;
align-items:center;
gap:10px;
padding:8px 8px 18px;
}

.brand-mark,.hero-logo{
display:grid;
place-items:center;
background:linear-gradient(135deg,#fff,#777783);
color:#08080b;
font-weight:950;
}

.brand-mark{
width:36px;
height:36px;
border-radius:11px;
font-size:17px;
}

.brand-name{
font-size:19px;
font-weight:800;
}

.new-chat{
width:100%;
border:1px solid #303039;
background:#1a1a21;
color:white;
border-radius:12px;
padding:12px;
text-align:left;
font-weight:650;
margin-bottom:16px;
}

.new-chat:hover{background:#23232c}

.sidebar-label{
color:#777783;
font-size:12px;
font-weight:700;
padding:8px;
text-transform:uppercase;
letter-spacing:.7px;
}

.history{
flex:1;
overflow-y:auto;
}

.history-item{
width:100%;
border:0;
background:transparent;
color:#bdbdc6;
text-align:left;
padding:10px;
border-radius:9px;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

.history-item:hover{
background:#1b1b22;
color:white;
}

.sidebar-bottom{
border-top:1px solid #24242c;
padding-top:12px;
}

.side-option{
width:100%;
background:transparent;
border:0;
color:#bdbdc6;
padding:11px 8px;
text-align:left;
border-radius:9px;
}

.side-option:hover{
background:#1b1b22;
color:white;
}

.main{
flex:1;
height:100%;
min-width:0;
display:flex;
flex-direction:column;
position:relative;
}

.topbar{
height:62px;
display:flex;
align-items:center;
padding:0 18px;
border-bottom:1px solid #1e1e25;
background:rgba(11,11,15,.86);
backdrop-filter:blur(12px);
z-index:10;
}

.menu-btn{
display:none;
border:0;
background:transparent;
color:white;
font-size:23px;
margin-right:10px;
}

.mobile-brand{
font-weight:800;
font-size:17px;
}

.mode-area{
margin-left:auto;
display:flex;
align-items:center;
gap:8px;
}

.mode{
background:#17171d;
color:#dddde5;
border:1px solid #292932;
border-radius:9px;
padding:8px 10px;
outline:none;
}

.home{
flex:1;
overflow-y:auto;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:35px 20px 140px;
}

.hero{
width:min(820px,100%);
text-align:center;
margin-bottom:25px;
}

.hero-logo{
width:62px;
height:62px;
margin:0 auto 20px;
border-radius:19px;
font-size:23px;
box-shadow:0 15px 50px rgba(255,255,255,.08);
}

.hero h1{
margin:0;
font-size:clamp(31px,6vw,50px);
letter-spacing:-2px;
line-height:1.05;
}

.hero p{
color:#8e8e99;
margin:12px 0 0;
font-size:15px;
}

.composer-wrap{
width:min(820px,100%);
}

.composer{
background:#17171d;
border:1px solid #303039;
border-radius:19px;
padding:12px;
box-shadow:0 18px 70px rgba(0,0,0,.35);
}

.composer:focus-within{
border-color:#50505c;
}

textarea{
width:100%;
min-height:65px;
max-height:190px;
resize:none;
border:0;
outline:0;
background:transparent;
color:white;
padding:7px 7px 14px;
font-size:16px;
line-height:1.5;
}

textarea::placeholder{color:#777782}

.composer-bottom{
display:flex;
align-items:center;
gap:8px;
}

.tool-btn{
border:1px solid #303039;
background:#202027;
color:#c8c8d0;
border-radius:9px;
padding:8px 10px;
font-size:13px;
}

.tool-btn:hover{
background:#292930;
color:white;
}

.send{
margin-left:auto;
border:0;
width:40px;
height:40px;
border-radius:11px;
background:white;
color:#08080b;
font-size:17px;
font-weight:900;
}

.send:hover{opacity:.88}

.send:disabled{
opacity:.4;
cursor:not-allowed;
}

.quick-modes{
width:min(820px,100%);
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:13px;
justify-content:center;
}

.quick{
border:1px solid #292932;
background:#131319;
color:#aaaab5;
padding:9px 13px;
border-radius:999px;
font-size:13px;
}

.quick:hover{
color:white;
border-color:#45454f;
background:#1b1b22;
}

.suggestions{
width:min(820px,100%);
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:25px;
}

.suggestion{
border:1px solid #25252d;
background:#111116;
border-radius:13px;
color:#c5c5ce;
padding:14px;
text-align:left;
line-height:1.4;
}

.suggestion strong{
display:block;
color:#eeeef2;
margin-bottom:4px;
}

.suggestion:hover{
background:#17171d;
border-color:#383842;
}

.results{
display:none;
flex:1;
overflow-y:auto;
padding:35px 20px 150px;
}

.result-inner{
width:min(850px,100%);
margin:auto;
}

.question-bubble{
background:#1b1b22;
border:1px solid #282831;
border-radius:15px;
padding:14px 16px;
margin-bottom:15px;
line-height:1.5;
color:#e9e9ee;
}

.mode-badge{
display:inline-block;
margin-bottom:25px;
padding:5px 9px;
border-radius:999px;
border:1px solid #303039;
color:#aaaab5;
font-size:11px;
background:#111116;
}

.answer-card{
line-height:1.7;
color:#e3e3e8;
font-size:15.5px;
overflow-wrap:anywhere;
}

.answer-card h1,
.answer-card h2,
.answer-card h3{
color:white;
}

.answer-card p{
margin:0 0 15px;
}

.answer-card ul,
.answer-card ol{
margin-top:5px;
margin-bottom:15px;
padding-left:25px;
}

.sources{
margin-top:35px;
border-top:1px solid #292932;
padding-top:20px;
}

.sources h3{
margin:0 0 12px;
font-size:15px;
}

.source{
display:block;
text-decoration:none;
color:#aaaab5;
border:1px solid #25252d;
background:#111116;
border-radius:11px;
padding:12px;
margin-bottom:8px;
}

.source:hover{
border-color:#41414b;
color:white;
}

.source-number{
color:white;
font-weight:800;
margin-right:6px;
}

.loading{
display:none;
align-items:center;
gap:10px;
color:#92929d;
margin:15px 0;
}

.loader{
width:17px;
height:17px;
border:2px solid #44444d;
border-top-color:white;
border-radius:50%;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.error{
display:none;
margin-top:15px;
padding:13px;
border:1px solid #542d35;
background:#25171b;
color:#ffb9c1;
border-radius:11px;
white-space:pre-wrap;
overflow-wrap:anywhere;
}

.status{
color:#777783;
font-size:12px;
margin-top:10px;
text-align:center;
}

@media(max-width:760px){

.sidebar{
position:fixed;
left:0;
top:0;
transform:translateX(-100%);
box-shadow:20px 0 60px rgba(0,0,0,.45);
}

.sidebar.open{
transform:translateX(0);
}

.menu-btn{
display:block;
}

.topbar{
height:56px;
padding:0 12px;
}

.home{
padding:25px 13px 125px;
justify-content:center;
}

.hero-logo{
width:55px;
height:55px;
border-radius:17px;
font-size:20px;
}

.hero h1{
font-size:34px;
}

.hero p{
font-size:13px;
}

.composer{
border-radius:16px;
}

.quick-modes{
justify-content:flex-start;
overflow-x:auto;
flex-wrap:nowrap;
padding-bottom:3px;
}

.quick{
flex-shrink:0;
}

.suggestions{
grid-template-columns:1fr;
}

.results{
padding:22px 13px 130px;
}

.mode{
font-size:12px;
padding:7px;
}

.tool-btn{
padding:8px;
}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

<div class="brand">
<div class="brand-mark">A</div>
<div class="brand-name">ARC-X</div>
</div>

<button class="new-chat" onclick="newChat()">
＋ New chat
</button>

<div class="sidebar-label">Recent</div>

<div class="history" id="history">
<div id="emptyHistory"
style="padding:10px;color:#666673;font-size:13px;">
Your conversations will appear here.
</div>
</div>

<div class="sidebar-bottom">

<button class="side-option" onclick="showComingSoon()">
⚙ Settings
</button>

<button class="side-option" onclick="showMemoryStatus()">
🧠 ARC-X Memory
</button>

</div>
</aside>

<main class="main">

<header class="topbar">

<button class="menu-btn" onclick="toggleSidebar()">
☰
</button>

<div class="mobile-brand">ARC-X</div>

<div class="mode-area">

<select class="mode" id="mode">

<option value="auto">ARC Auto</option>
<option value="search">Web Search</option>
<option value="think">Deep Think</option>
<option value="research">Deep Research</option>
<option value="create">Create</option>
<option value="code">Code</option>

</select>

</div>
</header>

<section class="home" id="home">

<div class="hero">

<div class="hero-logo">A</div>

<h1>What can I help you with?</h1>

<p>ARC-X — Search, Think, Create and Research.</p>

</div>

<div class="composer-wrap">

<div class="composer">

<textarea
id="question"
placeholder="Ask anything..."
rows="1"></textarea>

<div class="composer-bottom">

<button class="tool-btn" onclick="showComingSoon()">
＋
</button>

<button class="tool-btn" onclick="showComingSoon()">
📎 Attach
</button>

<button class="tool-btn" onclick="setMode('search')">
🌐 Search
</button>

<button class="send" id="sendBtn" onclick="askARCX()">
↑
</button>

</div>
</div>

<div class="quick-modes">

<button class="quick"
onclick="setPrompt('Search the web and explain the latest AI developments')">
🌐 Search
</button>

<button class="quick"
onclick="setPrompt('Think deeply about this problem and give me a well-reasoned answer')">
🧠 Think
</button>

<button class="quick"
onclick="setPrompt('Create a professional design concept for ')">
🎨 Create
</button>

<button class="quick"
onclick="setPrompt('Help me write and debug this code: ')">
💻 Code
</button>

</div>

<div class="suggestions">

<button class="suggestion"
onclick="setPrompt('Research a topic and give me a detailed report with sources')">

<strong>🔎 Deep Research</strong>

Research a topic and create a sourced report.

</button>

<button class="suggestion"
onclick="setPrompt('Help me build a modern website from scratch')">

<strong>💻 Build something</strong>

Plan and build a modern website.

</button>

<button class="suggestion"
onclick="setPrompt('Explain a difficult concept to me simply')">

<strong>📚 Learn</strong>

Understand something difficult step by step.

</button>

<button class="suggestion"
onclick="setPrompt('Create a professional graphic design concept for ')">

<strong>🎨 Design</strong>

Create a professional visual concept.

</button>

</div>

<div class="status">
ARC-X online • AI + Web Research + Memory
</div>

</div>
</section>

<section class="results" id="results">

<div class="result-inner">

<div class="question-bubble" id="questionDisplay"></div>

<div class="mode-badge" id="modeBadge"></div>

<div class="loading" id="loading">

<div class="loader"></div>

<span>ARC-X is thinking and researching...</span>

</div>

<div class="error" id="error"></div>

<div class="answer-card" id="answer"></div>

<div class="sources" id="sources">

<h3>Sources</h3>

<div id="sourceList"></div>

</div>

</div>
</section>

</main>
</div>

<script>

/* =========================
   ARC-X STATE
========================= */

const questionInput =
document.getElementById("question");

const sendBtn =
document.getElementById("sendBtn");

const home =
document.getElementById("home");

const results =
document.getElementById("results");

const answer =
document.getElementById("answer");

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("error");

const sourcesBox =
document.getElementById("sources");

const sourceList =
document.getElementById("sourceList");

const questionDisplay =
document.getElementById("questionDisplay");

const modeBadge =
document.getElementById("modeBadge");

let conversationId =
localStorage.getItem("arcx_conversation_id") || null;

let conversations = [];

try{

conversations =
JSON.parse(
localStorage.getItem("arcx_history") || "[]"
);

}catch(e){

conversations=[];

}

/* =========================
   SIDEBAR
========================= */

function toggleSidebar(){

document
.getElementById("sidebar")
.classList.toggle("open");

}

/* =========================
   MODE
========================= */

function setMode(mode){

document
.getElementById("mode")
.value=mode;

}

/* =========================
   PROMPT
========================= */

function setPrompt(text){

questionInput.value=text;

questionInput.focus();

autoResize();

}

/* =========================
   COMING SOON
========================= */

function showComingSoon(){

alert(
"ARC-X advanced attachments and multimodal tools are coming in the next upgrade."
);

}

/* =========================
   MEMORY
========================= */

function showMemoryStatus(){

if(conversationId){

alert(
"🧠 ARC-X Memory is active for this conversation."
);

}else{

alert(
"🧠 ARC-X will create memory when you start a conversation."
);

}

}

/* =========================
   NEW CHAT
========================= */

function newChat(){

conversationId=null;

localStorage.removeItem(
"arcx_conversation_id"
);

home.style.display="flex";

results.style.display="none";

questionInput.value="";

answer.innerHTML="";

errorBox.style.display="none";

sourcesBox.style.display="none";

modeBadge.textContent="";

document
.getElementById("sidebar")
.classList.remove("open");

questionInput.focus();

}

/* =========================
   RESIZE
========================= */

function autoResize(){

questionInput.style.height="auto";

questionInput.style.height=
Math.min(questionInput.scrollHeight,190)+"px";

}

questionInput.addEventListener(
"input",
autoResize
);

/* =========================
   ENTER SEND
========================= */

questionInput.addEventListener(
"keydown",
function(event){

if(event.key==="Enter" && !event.shiftKey){

event.preventDefault();

askARCX();

}

}
);

/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

const div=document.createElement("div");

div.textContent=text;

return div.innerHTML;

}

/* =========================
   ANSWER RENDERER
========================= */

function renderAnswer(text){

let html=escapeHTML(String(text || ""));

/* headings */

html=html.replace(
/^### (.*)$/gm,
"<h3>$1</h3>"
);

html=html.replace(
/^## (.*)$/gm,
"<h2>$1</h2>"
);

html=html.replace(
/^# (.*)$/gm,
"<h1>$1</h1>"
);

/* bold */

html=html.replace(
/\*\*(.*?)\*\*/g,
"<strong>$1</strong>"
);

/* italic */

html=html.replace(
/\*(.*?)\*/g,
"<em>$1</em>"
);

/* bullet lists */

html=html.replace(
/^(?:-|\u2022) (.*)$/gm,
"<li>$1</li>"
);

html=html.replace(
/(<li>.*<\/li>)/gs,
"<ul>$1</ul>"
);

/* numbered lists */

html=html.replace(
/^\d+\.\s+(.*)$/gm,
"<li>$1</li>"
);

/* line breaks */

html=html.replace(
/\n{2,}/g,
"</p><p>"
);

html=html.replace(
/\n/g,
"<br>"
);

return "<p>"+html+"</p>";

}

/* =========================
   HISTORY
========================= */

function saveHistory(question){

const item={
question:question,
conversationId:conversationId,
time:Date.now()
};

conversations.unshift(item);

conversations=
conversations.slice(0,20);

localStorage.setItem(
"arcx_history",
JSON.stringify(conversations)
);

renderHistory();

}

function renderHistory(){

const history=
document.getElementById("history");

history.innerHTML="";

if(!conversations.length){

history.innerHTML=
'<div style="padding:10px;color:#666673;font-size:13px;">Your conversations will appear here.</div>';

return;

}

conversations.forEach(function(item){

const button=
document.createElement("button");

button.className="history-item";

button.textContent=item.question;

button.onclick=function(){

if(item.conversationId){

conversationId=item.conversationId;

localStorage.setItem(
"arcx_conversation_id",
conversationId
);

}

alert(
"Conversation memory restored. Continue typing below."
);

};

history.appendChild(button);

});

}

/* =========================
   MAIN ARC-X REQUEST
========================= */

async function askARCX(){

const question=
questionInput.value.trim();

if(!question){

questionInput.focus();

return;

}

/* UI */

home.style.display="none";

results.style.display="block";

questionDisplay.textContent=question;

answer.innerHTML="";

errorBox.style.display="none";

sourcesBox.style.display="none";

sourceList.innerHTML="";

loading.style.display="flex";

sendBtn.disabled=true;

/* selected mode */

const mode=
document.getElementById("mode").value;

/* request */

try{

const response=
await fetch("/api/search",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

question:question,

mode:mode,

conversationId:conversationId

})

});

/* Read response safely */

const rawText=
await response.text();

let data;

try{

data=JSON.parse(rawText);

}catch(parseError){

throw new Error(
"ARC-X returned an invalid server response: "+rawText
);

}

/* HTTP error */

if(!response.ok){

throw new Error(
data.error ||
data.details ||
"ARC-X server request failed."
);

}

/* Save conversation ID */

if(data.conversationId){

conversationId=data.conversationId;

localStorage.setItem(
"arcx_conversation_id",
conversationId
);

}

/* Show mode */

modeBadge.textContent=
"ARC-X Mode: "+(data.mode || mode);

/* Show answer */

answer.innerHTML=
renderAnswer(data.answer || "ARC-X returned no answer.");

/* Sources */

if(
Array.isArray(data.sources) &&
data.sources.length
){

sourcesBox.style.display="block";

data.sources.forEach(function(source){

const link=
document.createElement("a");

link.className="source";

link.href=source.url || "#";

link.target="_blank";

link.rel="noopener noreferrer";

link.innerHTML=
'<span class="source-number">['+
source.id+
']</span>'+
escapeHTML(source.title || "Source");

sourceList.appendChild(link);

});

}else{

sourcesBox.style.display="none";

}

/* Save history */

saveHistory(question);

/* clear composer */

questionInput.value="";

autoResize();

}catch(error){

console.error(
"ARC-X frontend error:",
error
);

errorBox.textContent=
"ARC-X Error:\n"+error.message;

errorBox.style.display="block";

}finally{

loading.style.display="none";

sendBtn.disabled=false;

}

}

/* =========================
   INITIALIZE
========================= */

renderHistory();

autoResize();

</script>

</body>
  </html>
