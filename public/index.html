<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020816">
<title>ARC X — AI Super App</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#020816;
  --panel:#071120;
  --panel2:#0b1728;
  --border:#1b2b42;
  --text:#f5f7fb;
  --muted:#91a0b5;
  --accent:#7c8cff;
  --accent2:#42d9ff;
  --danger:#ff667d;
  --shadow:0 18px 50px rgba(0,0,0,.35);
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% -10%,rgba(66,217,255,.10),transparent 35%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
  width:280px;
  background:rgba(4,12,24,.96);
  border-right:1px solid var(--border);
  padding:18px;
  display:flex;
  flex-direction:column;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:50;
  transition:.25s ease;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 4px 20px;
}

.brand-mark{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#6876ff,#31cfff);
  color:white;
  font-weight:900;
  box-shadow:0 0 25px rgba(66,217,255,.18);
}

.brand-text strong{
  display:block;
  font-size:17px;
  letter-spacing:.5px;
}

.brand-text span{
  color:var(--muted);
  font-size:11px;
  letter-spacing:1.5px;
}

.new-chat{
  width:100%;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:13px;
  padding:13px;
  text-align:left;
  transition:.2s;
}

.new-chat:hover{
  border-color:var(--accent);
  background:var(--panel2);
}

.sidebar-title{
  color:#68778e;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.4px;
  margin:25px 5px 10px;
}

.history{
  flex:1;
  overflow:auto;
}

.history-empty{
  color:#66758b;
  font-size:13px;
  padding:10px 5px;
}

.history-item{
  border:0;
  background:transparent;
  color:#cdd6e4;
  width:100%;
  text-align:left;
  padding:10px;
  border-radius:10px;
  margin-bottom:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#0c192b;
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding-top:12px;
}

.side-action{
  width:100%;
  background:transparent;
  border:0;
  color:#cbd4e2;
  padding:11px 8px;
  text-align:left;
  border-radius:9px;
  margin-bottom:3px;
}

.side-action:hover{
  background:#0c192b;
}

/* ================= MAIN ================= */

.main{
  width:100%;
  margin-left:280px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:64px;
  display:flex;
  align-items:center;
  padding:0 22px;
  border-bottom:1px solid rgba(27,43,66,.7);
  position:sticky;
  top:0;
  background:rgba(2,8,22,.78);
  backdrop-filter:blur(16px);
  z-index:20;
}

.menu-btn{
  display:none;
  border:0;
  background:transparent;
  color:white;
  font-size:25px;
  margin-right:12px;
}

.top-title{
  font-weight:750;
}

.connection{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:7px;
  color:#91a0b5;
  font-size:12px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#777;
}

.dot.online{
  background:#4ee58a;
  box-shadow:0 0 12px rgba(78,229,138,.6);
}

.dot.offline{
  background:#ff667d;
}

/* ================= HOME ================= */

.content{
  width:min(1050px,calc(100% - 32px));
  margin:0 auto;
  padding:70px 0 150px;
}

.hero{
  text-align:center;
  max-width:760px;
  margin:0 auto 42px;
}

.hero-logo{
  width:68px;
  height:68px;
  margin:0 auto 20px;
  display:grid;
  place-items:center;
  border-radius:21px;
  font-size:27px;
  font-weight:900;
  background:linear-gradient(135deg,#6876ff,#31cfff);
  box-shadow:0 0 50px rgba(66,217,255,.14);
}

.hero h1{
  font-size:clamp(32px,6vw,56px);
  line-height:1;
  letter-spacing:-2px;
  margin-bottom:15px;
}

.hero p{
  color:var(--muted);
  font-size:15px;
  line-height:1.7;
}

/* ================= MODE CARDS ================= */

.explore-title{
  color:#aeb9ca;
  font-size:13px;
  margin-bottom:13px;
  text-align:center;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
}

.mode-card{
  border:1px solid var(--border);
  background:linear-gradient(180deg,rgba(10,23,40,.95),rgba(6,15,28,.95));
  border-radius:17px;
  padding:20px;
  color:white;
  text-align:left;
  min-height:150px;
  transition:.2s ease;
}

.mode-card:hover{
  transform:translateY(-2px);
  border-color:#405275;
  box-shadow:var(--shadow);
}

.mode-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:#111f34;
  color:#dce5ff;
  margin-bottom:18px;
  font-size:20px;
}

.mode-card h3{
  font-size:15px;
  margin-bottom:7px;
}

.mode-card p{
  color:#8493a9;
  font-size:12px;
  line-height:1.55;
}

/* ================= WORKSPACE ================= */

.workspace{
  margin-top:30px;
  display:none;
}

.workspace.active{
  display:block;
}

.workspace-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}

.back-btn{
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
  border-radius:10px;
  padding:8px 11px;
}

.workspace-header h2{
  font-size:20px;
}

.workspace-subtitle{
  color:var(--muted);
  font-size:12px;
  margin-left:auto;
}

/* ================= MESSAGES ================= */

.messages{
  min-height:180px;
  max-height:55vh;
  overflow:auto;
  padding:4px;
  margin-bottom:15px;
}

.message{
  display:flex;
  margin:10px 0;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:min(820px,90%);
  padding:13px 15px;
  border-radius:15px;
  line-height:1.65;
  font-size:14px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message.user .bubble{
  background:#182a46;
  border:1px solid #294364;
}

.message.assistant .bubble{
  background:#07111f;
  border:1px solid var(--border);
}

.message.system .bubble{
  color:#8493a9;
  font-size:12px;
  text-align:center;
  width:100%;
}

.sources{
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid var(--border);
}

.sources-title{
  font-size:12px;
  font-weight:700;
  margin-bottom:8px;
}

.source{
  display:block;
  padding:8px 10px;
  margin:5px 0;
  border-radius:9px;
  background:#0b182a;
  border:1px solid #172942;
  text-decoration:none;
  color:#9ccfff;
  font-size:11px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* ================= INPUT ================= */

.input-area{
  position:sticky;
  bottom:12px;
}

.composer{
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:9px;
  background:rgba(7,17,31,.96);
  border:1px solid #233650;
  border-radius:17px;
  box-shadow:0 15px 50px rgba(0,0,0,.4);
  backdrop-filter:blur(15px);
}

.composer textarea{
  flex:1;
  min-height:46px;
  max-height:150px;
  resize:none;
  background:transparent;
  border:0;
  outline:0;
  color:white;
  padding:12px 9px;
  line-height:1.4;
}

.composer textarea::placeholder{
  color:#64748a;
}

.send-btn{
  width:44px;
  height:44px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#6574ff,#36cfff);
  color:white;
  font-size:19px;
  font-weight:900;
}

.send-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.composer-hint{
  color:#586980;
  text-align:center;
  font-size:10px;
  margin-top:8px;
}

/* ================= LOADING ================= */

.loading{
  display:inline-flex;
  gap:5px;
  align-items:center;
}

.loading span{
  width:6px;
  height:6px;
  background:#8ea0ba;
  border-radius:50%;
  animation:pulse 1s infinite;
}

.loading span:nth-child(2){
  animation-delay:.15s;
}

.loading span:nth-child(3){
  animation-delay:.3s;
}

@keyframes pulse{
  0%,80%,100%{
    opacity:.25;
    transform:translateY(0);
  }
  40%{
    opacity:1;
    transform:translateY(-3px);
  }
}

/* ================= ERROR ================= */

.error{
  color:#ff9aaa;
  background:rgba(255,70,100,.07);
  border:1px solid rgba(255,70,100,.2);
}

/* ================= MOBILE ================= */

@media(max-width:850px){

  .sidebar{
    transform:translateX(-100%);
    box-shadow:20px 0 60px rgba(0,0,0,.5);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .menu-btn{
    display:block;
  }

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .content{
    padding-top:45px;
  }
}

@media(max-width:520px){

  .topbar{
    padding:0 14px;
  }

  .connection{
    display:none;
  }

  .content{
    width:calc(100% - 20px);
    padding-top:35px;
  }

  .hero{
    margin-bottom:30px;
  }

  .hero h1{
    font-size:39px;
  }

  .hero p{
    font-size:13px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .mode-card{
    padding:15px;
    min-height:145px;
  }

  .mode-card h3{
    font-size:13px;
  }

  .mode-card p{
    font-size:11px;
  }

  .workspace-subtitle{
    display:none;
  }

  .bubble{
    max-width:94%;
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-mark">X</div>
      <div class="brand-text">
        <strong>ARC X</strong>
        <span>AI SUPER APP</span>
      </div>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ &nbsp; New chat
    </button>

    <div class="sidebar-title">
      Recent chats
    </div>

    <div class="history" id="history">
      <div class="history-empty">
        No recent chats
      </div>
    </div>

    <div class="sidebar-bottom">

      <button class="side-action" onclick="toggleAppearance()">
        ◐ &nbsp; Appearance
      </button>

      <button class="side-action" onclick="clearHistory()">
        ⌫ &nbsp; Clear history
      </button>

    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <button class="menu-btn" onclick="toggleSidebar()">
        ☰
      </button>

      <div class="top-title">
        ARC X
      </div>

      <div class="connection">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Connecting...</span>
      </div>

    </header>

    <section class="content">

      <!-- HOME -->
      <div id="home">

        <div class="hero">

          <div class="hero-logo">
            X
          </div>

          <h1>
            Welcome to ARC X
          </h1>

          <p>
            Search the web, research topics, understand information,
            create content, code and explore ideas with ARC X.
          </p>

        </div>

        <div class="explore-title">
          Explore ARC X
        </div>

        <div class="cards">

          <button class="mode-card" onclick="openMode('search')">

            <div class="mode-icon">
              ⌕
            </div>

            <h3>
              Web Search
            </h3>

            <p>
              Find current information from the web.
            </p>

          </button>

          <button class="mode-card" onclick="openMode('research')">

            <div class="mode-icon">
              ◉
            </div>

            <h3>
              Deep Research
            </h3>

            <p>
              Research topics using multiple sources.
            </p>

          </button>

          <button class="mode-card" onclick="openMode('create')">

            <div class="mode-icon">
              ✦
            </div>

            <h3>
              Create
            </h3>

            <p>
              Write posts, scripts and documents.
            </p>

          </button>

          <button class="mode-card" onclick="openMode('code')">

            <div class="mode-icon">
              &lt;/&gt;
            </div>

            <h3>
              Code
            </h3>

            <p>
              Build and understand software.
            </p>

          </button>

        </div>

      </div>

      <!-- WORKSPACE -->
      <div class="workspace" id="workspace">

        <div class="workspace-header">

          <button class="back-btn" onclick="showHome()">
            ←
          </button>

          <h2 id="workspaceTitle">
            ARC X
          </h2>

          <div class="workspace-subtitle" id="workspaceSubtitle">
            AI
          </div>

        </div>

        <div class="messages" id="messages"></div>

        <div class="input-area">

          <div class="composer">

            <textarea
              id="input"
              placeholder="Ask ARC X anything..."
              rows="1"
              onkeydown="handleKey(event)"
            ></textarea>

            <button
              class="send-btn"
              id="sendBtn"
              onclick="sendMessage()"
            >
              ↑
            </button>

          </div>

          <div class="composer-hint">
            ARC X can make mistakes. Check important information.
          </div>

        </div>

      </div>

    </section>

  </main>

</div>

<script>
/* =========================================================
   ARC X FRONTEND
========================================================= */

const state = {
  mode: "chat",
  messages: [],
  history: []
};

const home = document.getElementById("home");
const workspace = document.getElementById("workspace");
const messagesEl = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const historyEl = document.getElementById("history");

const workspaceTitle = document.getElementById("workspaceTitle");
const workspaceSubtitle = document.getElementById("workspaceSubtitle");

const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");

const sidebar = document.getElementById("sidebar");

/* =========================================================
   MODE INFORMATION
========================================================= */

const modes = {
  search: {
    title: "Web Search",
    subtitle: "Live web search",
    placeholder: "Search the web..."
  },

  research: {
    title: "Deep Research",
    subtitle: "Multi-source research",
    placeholder: "What should ARC X research?"
  },

  create: {
    title: "Create",
    subtitle: "Content creation",
    placeholder: "What do you want ARC X to create?"
  },

  code: {
    title: "Code",
    subtitle: "AI coding assistant",
    placeholder: "Describe the code you need..."
  }
};

/* =========================================================
   OPEN MODE
========================================================= */

function openMode(mode){

  state.mode = mode;
  state.messages = [];

  const info = modes[mode];

  workspaceTitle.textContent = info.title;
  workspaceSubtitle.textContent = info.subtitle;

  input.placeholder = info.placeholder;

  home.style.display = "none";
  workspace.classList.add("active");

  messagesEl.innerHTML = "";

  addSystemMessage(
    mode === "search"
      ? "Ask ARC X to search the live web."
      : mode === "research"
      ? "Give ARC X a topic and it will research it using multiple web sources."
      : mode === "create"
      ? "Tell ARC X what you want created."
      : "Describe the software or coding problem you want help with."
  );

  input.focus();

  closeSidebar();
}

/* =========================================================
   HOME
========================================================= */

function showHome(){

  workspace.classList.remove("active");
  home.style.display = "block";

  state.mode = "chat";
  state.messages = [];

  input.value = "";

}

/* =========================================================
   NEW CHAT
========================================================= */

function newChat(){

  showHome();

  state.messages = [];

  messagesEl.innerHTML = "";

  closeSidebar();
}

/* =========================================================
   MESSAGE DISPLAY
========================================================= */

function addMessage(role, text, sources = []){

  const wrapper = document.createElement("div");

  wrapper.className = `message ${role}`;

  const bubble = document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  wrapper.appendChild(bubble);

  if(Array.isArray(sources) && sources.length){

    const sourceBox = document.createElement("div");

    sourceBox.className = "sources";

    const title = document.createElement("div");

    title.className = "sources-title";

    title.textContent = "Sources";

    sourceBox.appendChild(title);

    sources.forEach((source,index)=>{

      if(!source || !source.url) return;

      const link = document.createElement("a");

      link.className = "source";

      link.href = source.url;

      link.target = "_blank";

      link.rel = "noopener noreferrer";

      link.textContent =
        `${index + 1}. ${source.title || source.url}`;

      sourceBox.appendChild(link);

    });

    bubble.appendChild(sourceBox);
  }

  messagesEl.appendChild(wrapper);

  messagesEl.scrollTop = messagesEl.scrollHeight;

  return wrapper;
}

function addSystemMessage(text){

  const wrapper = document.createElement("div");

  wrapper.className = "message system";

  const bubble = document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  wrapper.appendChild(bubble);

  messagesEl.appendChild(wrapper);
}

function addLoading(){

  const wrapper = document.createElement("div");

  wrapper.className = "message assistant";

  wrapper.id = "loadingMessage";

  const bubble = document.createElement("div");

  bubble.className = "bubble";

  bubble.innerHTML = `
    <div class="loading">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  wrapper.appendChild(bubble);

  messagesEl.appendChild(wrapper);

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeLoading(){

  const loading = document.getElementById("loadingMessage");

  if(loading){
    loading.remove();
  }
}

/* =========================================================
   SEND
========================================================= */

async function sendMessage(){

  const text = input.value.trim();

  if(!text || sendBtn.disabled) return;

  addMessage("user", text);

  state.messages.push({
    role:"user",
    content:text
  });

  input.value = "";

  autoResize();

  sendBtn.disabled = true;

  addLoading();

  try{

    let data;

    if(state.mode === "search"){

      data = await apiRequest("/api/search-answer",{
        query:text
      });

    }

    else if(state.mode === "research"){

      data = await apiRequest("/api/research",{
        query:text
      });

    }

    else if(state.mode === "create"){

      data = await apiRequest("/api/create",{
        prompt:text,
        type:"general"
      });

    }

    else if(state.mode === "code"){

      data = await apiRequest("/api/code",{
        prompt:text
      });

    }

    else{

      data = await apiRequest("/api/chat",{
        message:text,
        messages:state.messages
      });

    }

    removeLoading();

    if(!data || data.ok === false){

      throw new Error(
        data?.error || "ARC X returned an unknown error."
      );
    }

    const answer =
      data.answer ||
      data.response ||
      data.research ||
      "ARC X returned no answer.";

    addMessage(
      "assistant",
      answer,
      data.sources || data.results || []
    );

    state.messages.push({
      role:"assistant",
      content:answer
    });

    saveHistory(text);

  }
  catch(error){

    removeLoadi
