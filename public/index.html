<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">
  <title>ARC-X — AI Search & Intelligence</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #0b0b0f;
      color: #f5f5f5;
    }

    body {
      overflow: hidden;
    }

    button, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* SIDEBAR */

    .sidebar {
      width: 270px;
      height: 100%;
      background: #111116;
      border-right: 1px solid #24242c;
      padding: 14px;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px 18px;
    }

    .brand-mark,
    .hero-logo {
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ffffff, #777783);
      color: #08080b;
      font-weight: 950;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      font-size: 17px;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .new-chat {
      width: 100%;
      border: 1px solid #303039;
      background: #1a1a21;
      color: white;
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      font-weight: 650;
      margin-bottom: 16px;
    }

    .new-chat:hover {
      background: #23232c;
    }

    .sidebar-label {
      color: #777783;
      font-size: 12px;
      font-weight: 700;
      padding: 8px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
    }

    .history-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: #bdbdc6;
      text-align: left;
      padding: 10px;
      border-radius: 9px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      background: #1b1b22;
      color: white;
    }

    .sidebar-bottom {
      border-top: 1px solid #24242c;
      padding-top: 12px;
    }

    .side-option {
      width: 100%;
      background: transparent;
      border: 0;
      color: #bdbdc6;
      padding: 11px 8px;
      text-align: left;
      border-radius: 9px;
    }

    .side-option:hover {
      background: #1b1b22;
      color: white;
    }

    /* MAIN */

    .main {
      flex: 1;
      height: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 62px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #1e1e25;
      background: rgba(11, 11, 15, 0.86);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .menu-btn {
      display: none;
      border: 0;
      background: transparent;
      color: white;
      font-size: 23px;
      margin-right: 10px;
    }

    .mobile-brand {
      font-weight: 800;
      font-size: 17px;
    }

    .mode-area {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode {
      background: #17171d;
      color: #dddde5;
      border: 1px solid #292932;
      border-radius: 9px;
      padding: 8px 10px;
      outline: none;
    }

    /* HOME */

    .home {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 35px 20px 140px;
    }

    .hero {
      width: min(820px, 100%);
      text-align: center;
      margin-bottom: 25px;
    }

    .hero-logo {
      width: 62px;
      height: 62px;
      margin: 0 auto 20px;
      border-radius: 19px;
      font-size: 23px;
      box-shadow: 0 15px 50px rgba(255,255,255,0.08);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(31px, 6vw, 50px);
      letter-spacing: -2px;
      line-height: 1.05;
    }

    .hero p {
      color: #8e8e99;
      margin: 12px 0 0;
      font-size: 15px;
    }

    /* COMPOSER */

    .composer-wrap {
      width: min(820px, 100%);
    }

    .composer {
      background: #17171d;
      border: 1px solid #303039;
      border-radius: 19px;
      padding: 12px;
      box-shadow: 0 18px 70px rgba(0,0,0,0.35);
    }

    .composer:focus-within {
      border-color: #50505c;
    }

    textarea {
      width: 100%;
      min-height: 65px;
      max-height: 190px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 7px 7px 14px;
      font-size: 16px;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: #777782;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-btn {
      border: 1px solid #303039;
      background: #202027;
      color: #c8c8d0;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 13px;
    }

    .tool-btn:hover {
      background: #292930;
      color: white;
    }

    .send {
      margin-left: auto;
      border: 0;
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: white;
      color: #08080b;
      font-size: 17px;
      font-weight: 900;
    }

    .send:hover {
      opacity: 0.88;
    }

    .send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* QUICK MODES */

    .quick-modes {
      width: min(820px, 100%);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 13px;
      justify-content: center;
    }

    .quick {
      border: 1px solid #292932;
      background: #131319;
      color: #aaaab5;
      padding: 9px 13px;
      border-radius: 999px;
      font-size: 13px;
    }

    .quick:hover {
      color: white;
      border-color: #45454f;
      background: #1b1b22;
    }

    /* SUGGESTIONS */

    .suggestions {
      width: min(820px, 100%);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 25px;
    }

    .suggestion {
      border: 1px solid #25252d;
      background: #111116;
      border-radius: 13px;
      color: #c5c5ce;
      padding: 14px;
      text-align: left;
      line-height: 1.4;
    }

    .suggestion strong {
      display: block;
      color: #eeeef2;
      margin-bottom: 4px;
    }

    .suggestion:hover {
      background: #17171d;
      border-color: #383842;
    }

    /* RESULTS */

    .results {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px 150px;
    }

    .result-inner {
      width: min(850px, 100%);
      margin: auto;
    }

    .question-bubble {
      background: #1b1b22;
      border: 1px solid #282831;
      border-radius: 15px;
      padding: 14px 16px;
      margin-bottom: 25px;
      line-height: 1.5;
      color: #e9e9ee;
    }

    .mode-badge {
      display: inline-block;
      margin-top: 9px;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid #303039;
      color: #aaaab5;
      font-size: 11px;
      background: #111116;
    }

    .answer-card {
      line-height: 1.7;
      color: #e3e3e8;
      font-size: 15.5px;
      overflow-wrap: anywhere;
    }

    .answer-card h1,
    .answer-card h2,
    .answer-card h3 {
      color: white;
    }

    .answer-card p {
      margin: 0 0 15px;
    }

    /* SOURCES */

    .sources {
      margin-top: 35px;
      border-top: 1px solid #292932;
      padding-top: 20px;
    }

    .sources h3 {
      margin: 0 0 12px;
      font-size: 15px;
    }

    .source {
      display: block;
      text-decoration: none;
      color: #aaaab5;
      border: 1px solid #25252d;
      background: #111116;
      border-radius: 11px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .source:hover {
      border-color: #41414b;
      color: white;
    }

    .source-number {
      color: white;
      font-weight: 800;
      margin-right: 6px;
    }

    /* LOADING */

    .loading {
      display: none;
      align-items: center;
      gap: 10px;
      color: #92929d;
      margin: 15px 0;
    }

    .loader {
      width: 17px;
      height: 17px;
      border: 2px solid #44444d;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ERROR */

    .error {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border: 1px solid #542d35;
      background: #25171b;
      color: #ffb9c1;
      border-radius: 11px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* MOBILE */

    @media (max-width: 760px) {

      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        transform: translateX(-100%);
        box-shadow: 20px 0 60px rgba(0,0,0,0.45);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .menu-btn {
        display: block;
      }

      .topbar {
        height: 56px;
        padding: 0 12px;
      }

      .home {
        padding: 25px 13px 125px;
        justify-content: center;
      }

      .hero-logo {
        width: 55px;
        height: 55px;
        border-radius: 17px;
        font-size: 20px;
      }

      .hero h1 {
        font-size: 34px;
      }

      .hero p {
        font-size: 13px;
      }

      .composer {
        border-radius: 16px;
      }

      .quick-modes {
        justify-content: flex-start;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 3px;
      }

      .quick {
        flex-shrink: 0;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .results {
        padding: 22px 13px 130px;
      }

      .mode {
        font-size: 12px;
        padding: 7px;
      }

      .tool-btn {
        padding: 8px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-mark">A</div>
      <div class="brand-name">ARC-X</div>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New chat
    </button>

    <div class="sidebar-label">
      Recent
    </div>

    <div class="history" id="history">

      <div id="emptyHistory"
        style="padding:10px;color:#666673;font-size:13px;">
        Your conversations will appear here.
      </div>

    </div>

    <div class="sidebar-bottom">

      <button
        class="side-option"
        onclick="showComingSoon()">
        ⚙ Settings
      </button>

      <button
        class="side-option"
        onclick="showMemoryStatus()">
        🧠 ARC-X Memory
      </button>

    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <button
        class="menu-btn"
        onclick="toggleSidebar()">
        ☰
      </button>

      <div class="mobile-brand">
        ARC-X
      </div>

      <div class="mode-area">

        <select
          class="mode"
          id="mode">

          <option value="auto">
            ARC Auto
          </option>

          <option value="search">
            Web Search
          </option>

          <option value="think">
            Deep Think
          </option>

          <option value="research">
            Deep Research
          </option>

          <option value="create">
            Create
          </option>

          <option value="code">
            Code
          </option>

        </select>

      </div>

    </header>

    <!-- HOME -->

    <section
      class="home"
      id="home">

      <div class="hero">

        <div class="hero-logo">
          A
        </div>

        <h1>
          What can I help you with?
        </h1>

        <p>
          ARC-X — Search, Think, Create and Research.
        </p>

      </div>

      <div class="composer-wrap">

        <div class="composer">

          <textarea
            id="question"
            placeholder="Ask anything..."
            rows="1"></textarea>

          <div class="composer-bottom">

            <button
              class="tool-btn"
              onclick="showComingSoon()">
              ＋
            </button>

            <button
              class="tool-btn"
              onclick="showComingSoon()">
              📎 Attach
            </button>

            <button
              class="tool-btn"
              onclick="setMode('search')">
              🌐 Search
            </button>

            <button
              class="send"
              id="sendBtn"
              onclick="askARCX()">
              ↑
            </button>

          </div>

        </div>

        <div class="quick-modes">

          <button
            class="quick"
            onclick="setPrompt('Search the web and explain the latest AI developments')">
            🌐 Search
          </button>

          <button
            class="quick"
            onclick="setPrompt('Think deeply about this problem and give me a well-reasoned answer')">
            🧠 Think
          </button>

          <button
            class="quick"
            onclick="setPrompt('Create a professional design concept for ')">
            🎨 Create
          </button>

          <button
            class="quick"
            onclick="setPrompt('Help me write and debug this code: ')">
            💻 Code
          </button>

        </div>

        <div class="suggestions">

          <button
            class="suggestion"
            onclick="setPrompt('Research a topic and give me a detailed report with sources')">

            <strong>
              🔎 Deep Research
            </strong>

            Research a topic and create a sourced report.

          </button>

          <button
            class="suggestion"
            onclick="setPrompt('Help me build a modern website from scratch')">

            <strong>
              💻 Build something
            </strong>

            Plan and build a modern website.

          </button>

          <button
            class="suggestion"
            onclick="setPrompt('Explain a difficult concept to me simply')">

            <strong>
              📚 Learn
            </strong>

            Understand something difficult step by step.

          </button>

          <button
            class="suggestion"
            onclick="setPrompt('Create a professional graphic design concept for ')">

            <strong>
              🎨 Design
            </strong>

            Create a professional visual concept.

          </button>

        </div>

      </div>

    </section>

    <!-- RESULTS -->

    <section
      class="results"
      id="results">

      <div class="result-inner">

        <div
          class="question-bubble"
          id="questionDisplay">
        </div>

        <div
          class="mode-badge"
          id="modeBadge">
        </div>

        <div
          class="loading"
          id="loading">

          <div class="loader"></div>

          <span>
            ARC-X is thinking and researching...
          </span>

        </div>

        <div
          class="error"
          id="error">
        </div>

        <div
          class="answer-card"
          id="answer">
        </div>

        <div
          class="sources"
          id="sources">

          <h3>
            Sources
          </h3>

          <div id="sourceList"></div>

        </div>

      </div>

    </section>

  </main>

</div>

<script>

  /* =========================
     ARC-X STATE
  ========================= */

  const questionInput =
    document.getElementById("question");

  const sendBtn =
    document.getElementById("sendBtn");

  const home =
    document.getElementById("home");

  const results =
    document.getElementById("results");

  const answer =
    document.getElementById("answer");

  const loading =
    document.getElementById("loading");

  const errorBox =
    document.getElementById("error");

  const sourcesBox =
    document.getElementById("sources");

  const sourceList =
    document.getElementById("sourceList");

  const questionDisplay =
    document.getElementById("questionDisplay");

  const modeBadge =
    document.getElementById("modeBadge");

  let conversationId =
    localStorage.getItem("arcx_conversation_id") || null;

  let conversations =
    JSON.parse(
      localStorage.getItem(
        "arcx_history"
      ) || "[]"
    );

  /* =========================
     SIDEBAR
  ========================= */

  function toggleSidebar() {

    document
      .getElementById("sidebar")
      .classList.toggle("open");

  }

  /* =========================
     MODE
  ========================= */

  function setMode(mode) {

    document
      .getElementById("mode")
      .value = mode;

  }

  /* =========================
     PROMPTS
  ========================= */

  function setPrompt(text) {

    questionInput.value = text;

    questionInput.focus();

    autoResize();

  }

  /* =========================
     COMING SOON
  ========================= */

  function showComingSoon() {

    alert(
      "ARC-X advanced attachments and multimodal tools are coming in the next upgrade."
    );

  }

  /* =========================
     MEMORY STATUS
  ========================= */

  function showMemoryStatus() {

    if (conversationId) {

      alert(
        "🧠 ARC-X Memory is active for this conversation."
      );

    } else {

      alert(
        "🧠 ARC-X will create memory when you start a conversation."
      );

    }

  }

  /* =========================
     NEW CHAT
  ========================= */

  async function newChat() {

    conversationId = null;

    localStorage.removeItem(
      "arcx_conversation_id"
    );

    home.style.display = "flex";

    results.style.display = "none";

    questionInput.value = "";

    answer.innerHTML = "";

    errorBox.style.display = "none";

    sourcesBox.style.display = "none";

    modeBadge.textContent = "";

    document
      .getElementById("sidebar")
      .classList.remove("open");

    questionInput.focus();

  }

  /* =========================
     RESIZE
  ========================= */

  function autoResize() {

    questionInput.style.height =
      "auto";

    questionInput.style.height =
      Math.min(
        questionInput.scrollHeight,
        190
      ) + "px";

  }

  questionInput.addEventListener(
    "input",
    autoResize
  );

  /* =========================
     ENTER TO SEND
  ========================= */

  questionInput.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        askARCX();

      }

    }
  );

  /* =========================
     SAFE HTML
  ========================= */

  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }

  /* =========================
     ANSWER RENDERER
  ========================= */

  function renderAnswer(text) {

    let html =
      escapeHTML(text);

    html =
      html.replace(
        /^### (.*)$/gm,
        "<h3>$1</h3>"
      );

    html =
      html.replace(
        /^## (.*)$/gm,
        "<h2>$1</h2>"
      );

    html =
      html.replace(
        /^# (.*)$/gm,
        "<h1>$1</h1>"
      );

    html =
      html.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
