<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07070a" />
  <title>ARC X — AI Search</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #08090c;
      --panel: #101217;
      --panel2: #15171d;
      --border: rgba(255,255,255,.09);
      --text: #f5f7fb;
      --muted: #9298a5;
      --accent: #7c5cff;
      --accent2: #19c7ff;
      --user: #20242d;
      --danger: #ff5d73;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
    }

    body.light {
      --bg: #f7f8fb;
      --panel: #ffffff;
      --panel2: #f0f2f6;
      --border: rgba(0,0,0,.09);
      --text: #101217;
      --muted: #68707d;
      --user: #e9ebf1;
      --shadow: 0 18px 50px rgba(0,0,0,.10);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background:
        radial-gradient(circle at 50% -20%, rgba(124,92,255,.14), transparent 35%),
        var(--bg);
      color: var(--text);
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      position: relative;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 270px;
      height: 100%;
      background: rgba(10,11,15,.94);
      border-right: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      z-index: 30;
      transition: transform .25s ease;
    }

    body.light .sidebar {
      background: rgba(255,255,255,.96);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 7px 5px 20px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, #101322, #18122b);
      border: 1px solid rgba(124,92,255,.45);
      box-shadow:
        0 0 25px rgba(124,92,255,.20),
        inset 0 0 18px rgba(25,199,255,.08);
    }

    .logo::before {
      content: "A";
      position: absolute;
      font-size: 20px;
      font-weight: 900;
      color: #8d75ff;
      transform: translate(-3px, 0);
    }

    .logo::after {
      content: "X";
      position: absolute;
      font-size: 18px;
      font-weight: 900;
      color: #19c7ff;
      transform: translate(7px, 2px);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 10px;
      margin-top: 2px;
    }

    .new-chat {
      width: 100%;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel2);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      margin-bottom: 18px;
      transition: .2s;
    }

    .new-chat:hover {
      border-color: rgba(124,92,255,.5);
      transform: translateY(-1px);
    }

    .new-chat span:first-child {
      font-size: 22px;
    }

    .side-title {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 4px 7px 9px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
    }

    .history-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 10px;
      border-radius: 10px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .history-item:hover {
      background: var(--panel2);
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .side-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 11px;
      border-radius: 10px;
      text-align: left;
      font-size: 13px;
    }

    .side-btn:hover {
      background: var(--panel2);
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 62px;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,9,12,.55);
      backdrop-filter: blur(16px);
      z-index: 10;
    }

    body.light .topbar {
      background: rgba(247,248,251,.7);
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--text);
      display: grid;
      place-items: center;
      font-size: 21px;
    }

    .icon-btn:hover {
      background: var(--panel2);
    }

    .mobile-menu {
      display: none;
    }

    .top-title {
      font-size: 15px;
      font-weight: 700;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      margin-right: 5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #35d27a;
      border-radius: 50%;
      box-shadow: 0 0 9px #35d27a;
    }

    /* =========================
       CONTENT
    ========================= */

    .content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      position: relative;
    }

    .home {
      width: min(940px, 100%);
      min-height: 100%;
      margin: auto;
      padding: 65px 22px 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-logo {
      width: 78px;
      height: 78px;
      border-radius: 24px;
      margin-bottom: 22px;
      transform: scale(1);
      box-shadow:
        0 0 50px rgba(124,92,255,.18),
        inset 0 0 25px rgba(25,199,255,.08);
    }

    .hero-logo::before {
      font-size: 37px;
    }

    .hero-logo::after {
      font-size: 32px;
    }

    .hero-title {
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.05;
      letter-spacing: -2px;
      text-align: center;
      font-weight: 850;
    }

    .gradient {
      background: linear-gradient(90deg, #fff, #a993ff, #5bdcff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-sub {
      color: var(--muted);
      text-align: center;
      margin-top: 12px;
      max-width: 610px;
      line-height: 1.55;
      font-size: 14px;
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      width: min(900px, 100%);
      margin: auto;
      padding: 25px 20px 170px;
      display: none;
    }

    .chat.active {
      display: block;
    }

    .home.hidden {
      display: none;
    }

    .message {
      display: flex;
      margin: 17px 0;
      animation: appear .22s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 82%;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user .bubble {
      background: var(--user);
      border: 1px solid var(--border);
      border-bottom-right-radius: 6px;
    }

    .message.assistant .bubble {
      max-width: 100%;
      padding-left: 0;
      padding-right: 0;
    }

    .assistant-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 8px;
    }

    .mini-logo {
      width: 22px;
      height: 22px;
      border-radius: 7px;
    }

    .mini-logo::before {
      font-size: 11px;
    }

    .mini-logo::after {
      font-size: 10px;
    }

    .sources {
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 13px;
    }

    .sources-title {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .source {
      display: block;
      text-decoration: none;
      color: var(--text);
      background: var(--panel2);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 10px;
      margin: 6px 0;
      font-size: 12px;
    }

    .source:hover {
      border-color: rgba(124,92,255,.5);
    }

    .source-url {
      color: var(--muted);
      margin-top: 3px;
      font-size: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .error {
      color: #ff8091;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-wrap {
      position: fixed;
      left: 270px;
      right: 0;
      bottom: 0;
      padding: 12px 18px 18px;
      z-index: 20;
      background: linear-gradient(
        to top,
        var(--bg) 62%,
        transparent
      );
    }

    .composer-area {
      width: min(900px, 100%);
      margin: auto;
      position: relative;
    }

    .tool-menu {
      display: none;
      position: absolute;
      left: 0;
      bottom: 73px;
      width: min(430px, calc(100vw - 35px));
      background: rgba(17,18,23,.98);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px;
      box-shadow: var(--shadow);
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      animation: menuIn .18s ease;
    }

    body.light .tool-menu {
      background: rgba(255,255,255,.98);
    }

    .tool-menu.open {
      display: grid;
    }

    @keyframes menuIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .tool {
      border: 1px solid transparent;
      border-radius: 13px;
      background: var(--panel2);
      color: var(--text);
      min-height: 62px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 9px;
      text-align: left;
    }

    .tool:hover {
      border-color: rgba(124,92,255,.45);
      transform: translateY(-1px);
    }

    .tool-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: rgba(124,92,255,.12);
      font-size: 16px;
      flex-shrink: 0;
    }

    .tool-name {
      font-size: 12px;
      font-weight: 700;
    }

    .tool-desc {
      color: var(--muted);
      font-size: 9px;
      margin-top: 2px;
    }

    .composer {
      background: rgba(18,20,26,.96);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 19px;
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
      overflow: hidden;
    }

    body.light .composer {
      background: rgba(255,255,255,.97);
    }

    .attachment-preview {
      display: none;
      padding: 9px 13px 0;
    }

    .attachment-preview.show {
      display: block;
    }

    .attachment-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 9px;
      border-radius: 9px;
      background: var(--panel2);
      border: 1px solid var(--border);
      font-size: 11px;
    }

    .remove-file {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      padding: 10px;
    }

    #prompt {
      flex: 1;
      min-width: 0;
      max-height: 150px;
      min-height: 40px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      padding: 10px 6px;
      line-height: 1.4;
      font-size: 14px;
    }

    #prompt::placeholder {
      color: #777d89;
    }

    .circle-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      display: grid;
      place-items: center;
      font-size: 19px;
    }

    .circle-btn:hover {
      border-color: rgba(124,92,255,.5);
    }

    .send-btn {
      border: 0;
      background: linear-gradient(135deg, #7c5cff, #4e7cff);
      color: white;
      box-shadow: 0 5px 18px rgba(92,92,255,.28);
    }

    .send-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px 9px;
    }

    .modes {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .modes::-webkit-scrollbar {
      display: none;
    }

    .mode {
      white-space: nowrap;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 9px;
      padding: 5px 8px;
      font-size: 10px;
    }

    .mode:hover {
      background: var(--panel2);
      color: var(--text);
    }

    .mode.active {
      color: var(--text);
      background: rgba(124,92,255,.14);
      border-color: rgba(124,92,255,.25);
    }

    .hint {
      color: #696f7a;
      font-size: 9px;
      white-space: nowrap;
    }

    /* =========================
       QUICK ACTIONS
    ========================= */

    .quick-title {
      width: 100%;
      font-size: 12px;
      font-weight: 700;
      margin: 55px 0 13px;
    }

    .quick-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .quick {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 14px;
      padding: 15px;
      text-align: left;
      min-height: 88px;
      transition: .2s;
    }

    .quick:hover {
      transform: translateY(-2px);
      border-color: rgba(124,92,255,.4);
    }

    .quick-icon {
      font-size: 19px;
      margin-bottom: 9px;
    }

    .quick-name {
      font-size: 12px;
      font-weight: 700;
    }

    .quick-desc {
      color: var(--muted);
      font-size: 9px;
      margin-top: 4px;
      line-height: 1.35;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 105px;
      transform: translate(-50%, 15px);
      opacity: 0;
      pointer-events: none;
      background: #181b22;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      z-index: 100;
      transition: .2s;
      box-shadow: var(--shadow);
      max-width: calc(100vw - 30px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        transform: translateX(-105%);
        box-shadow: var(--shadow);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-menu {
        display: grid;
      }

      .composer-wrap {
        left: 0;
        padding: 8px 10px 10px;
      }

      .topbar {
        padding: 0 9px;
      }

      .status {
        display: none;
      }

      .home {
        padding: 45px 15px 150px;
      }

      .hero-logo {
        width: 68px;
        height: 68px;
      }

      .hero-title {
        font-size: 35px;
      }

      .hero-sub {
        font-size: 13px;
      }

      .quick-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .quick {
        min-height: 82px;
      }

      .chat {
        padding: 15px 13px 155px;
      }

      .bubble {
        max-width: 88%;
      }

      .hint {
        display: none;
      }

      .tool-menu {
        bottom: 68px;
      }
    }

    @media (max-width: 420px) {
      .mode {
        padding: 5px 7px;
        font-size: 9px;
      }

      .composer-bottom {
        padding-left: 9px;
        padding-right: 9px;
      }

      .quick-title {
        margin-top: 40px;
      }
    }

    /* =========================
       LOADING
    ========================= */

    .typing {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 25px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: typing 1.1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: .4;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <div class="logo"></div>

        <div>
          <div class="brand-name">ARC X</div>
          <div class="brand-sub">AI SEARCH ENGINE</div>
        </div>
      </div>

      <button class="new-chat" id="newChat">
        <span>＋</span>
        <span>New chat</span>
      </button>

      <div class="side-title">Recent chats</div>

      <div class="history" id="history"></div>

      <div class="sidebar-bottom">
        <button class="side-btn" id="themeSide">☼ &nbsp; Appearance</button>
        <button class="side-btn" id="clearHistory">⌫ &nbsp; Clear history</button>
      </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

      <!-- TOP BAR -->
      <header class="topbar">

        <div class="top-left">
          <button class="icon-btn mobile-menu" id="menuBtn">☰</button>

          <button class="icon-btn" id="desktopSideBtn">☰</button>

          <div class="top-title">ARC X</div>
        </div>

        <div class="top-right">

          <div class="status">
            <span class="status-dot"></span>
            ARC X Online
          </div>

          <button class="icon-btn" id="themeBtn" title="Toggle theme">
            ◐
          </button>

        </div>

      </header>

      <!-- CONTENT -->
      <section class="content" id="content">

        <!-- HOME -->
        <div class="home" id="home">

          <div class="logo hero-logo"></div>

          <h1 class="hero-title">
            Welcome to <span class="gradient">ARC X</span>
          </h1>

          <p class="hero-sub">
            Search the web, research topics, understand information,
            write, code and explore ideas with ARC X.
          </p>

          <div class="quick-title">
            Explore ARC X
          </div>

          <div class="quick-grid">

            <button class="quick" data-action="search">
              <div class="quick-icon">⌕</div>
              <div class="quick-name">Web Search</div>
              <div class="quick-desc">Find current information from the web.</div>
