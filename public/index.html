<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f">
<title>ARC X — AI Super App</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0b0b0f;
  --sidebar:#101014;
  --panel:#15151b;
  --panel2:#1c1c23;
  --border:#292932;
  --text:#f7f7f8;
  --muted:#9999a6;
  --accent:#8b5cf6;
  --accent2:#4f9cff;
  --danger:#ff6868;
  --success:#50d890;
}

body.light{
  --bg:#f7f7f8;
  --sidebar:#ffffff;
  --panel:#ffffff;
  --panel2:#f0f0f3;
  --border:#dedee5;
  --text:#17171c;
  --muted:#666672;
}

html,body{
  width:100%;
  height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  overflow:hidden;
}

button,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:270px;
  height:100%;
  flex-shrink:0;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:16px;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:22px;
}

.logo{
  width:42px;
  height:42px;
  flex-shrink:0;
}

.brand-title{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.4px;
}

.brand-subtitle{
  font-size:9px;
  color:var(--muted);
  letter-spacing:1.5px;
  margin-top:2px;
}

.new-chat{
  width:100%;
  height:44px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel);
  color:var(--text);
  text-align:left;
  padding:0 14px;
  font-weight:650;
  transition:.15s;
}

.new-chat:hover{
  background:var(--panel2);
  transform:translateY(-1px);
}

.sidebar-label{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  margin:23px 5px 9px;
}

.history{
  flex:1;
  overflow-y:auto;
}

.history::-webkit-scrollbar,
.main::-webkit-scrollbar,
.messages::-webkit-scrollbar{
  width:5px;
}

.history::-webkit-scrollbar-thumb,
.main::-webkit-scrollbar-thumb,
.messages::-webkit-scrollbar-thumb{
  background:var(--border);
  border-radius:10px;
}

.history-item{
  width:100%;
  border:0;
  background:transparent;
  color:var(--muted);
  text-align:left;
  padding:10px 11px;
  border-radius:9px;
  margin-bottom:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:13px;
}

.history-item:hover,
.history-item.active{
  background:var(--panel2);
  color:var(--text);
}

.empty-history{
  color:var(--muted);
  font-size:12px;
  padding:10px 5px;
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  margin-top:10px;
  padding-top:10px;
}

.sidebar-button{
  width:100%;
  border:0;
  background:transparent;
  color:var(--muted);
  text-align:left;
  padding:10px;
  border-radius:9px;
}

.sidebar-button:hover{
  background:var(--panel2);
  color:var(--text);
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  min-width:0;
  height:100%;
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================
   TOPBAR
========================= */

.topbar{
  height:62px;
  flex-shrink:0;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.top-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.mobile-logo{
  display:none;
  align-items:center;
  gap:8px;
  font-weight:800;
}

.mobile-logo svg{
  width:30px;
  height:30px;
}

.menu{
  display:none;
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
  color:var(--text);
}

.model-pill{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  border-radius:20px;
  padding:8px 12px;
  font-size:12px;
}

.top-actions{
  display:flex;
  gap:7px;
}

.icon-button{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
  color:var(--text);
}

.icon-button:hover{
  background:var(--panel2);
}

/* =========================
   HOME
========================= */

.home{
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:70px 20px 100px;
}

.hero{
  width:min(900px,100%);
  display:flex;
  flex-direction:column;
  align-items:center;
}

.hero-logo{
  width:72px;
  height:72px;
  margin-bottom:23px;
  filter:drop-shadow(0 0 25px rgba(124,92,255,.25));
}

.hero-title{
  font-size:clamp(34px,5vw,54px);
  line-height:1.05;
  letter-spacing:-2px;
  font-weight:800;
  text-align:center;
}

.hero-gradient{
  background:linear-gradient(
    90deg,
    #ffffff,
    #a8baff,
    #9d7cff
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

body.light .hero-gradient{
  background:linear-gradient(
    90deg,
    #17171c,
    #6356c9
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero-description{
  color:var(--muted);
  max-width:650px;
  text-align:center;
  line-height:1.6;
  margin-top:15px;
  font-size:15px;
}

/* =========================
   COMPOSER
========================= */

.composer-container{
  width:min(820px,100%);
  margin-top:34px;
}

.composer{
  width:100%;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:13px;
  box-shadow:
    0 15px 45px rgba(0,0,0,.16),
    inset 0 1px 0 rgba(255,255,255,.02);
  transition:border .2s, box-shadow .2s;
}

.composer:focus-within{
  border-color:rgba(139,92,246,.55);
  box-shadow:
    0 15px 50px rgba(0,0,0,.2),
    0 0 0 3px rgba(139,92,246,.08);
}

textarea{
  width:100%;
  min-height:72px;
  max-height:190px;
  border:0;
  outline:0;
  resize:none;
  background:transparent;
  color:var(--text);
  padding:7px;
  font-size:16px;
  line-height:1.5;
}

textarea::placeholder{
  color:var(--muted);
}

.composer-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.modes{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.mode{
  border:1px solid var(--border);
  background:transparent;
  color:var(--muted);
  border-radius:9px;
  padding:7px 10px;
  font-size:12px;
  transition:.15s;
}

.mode:hover{
  color:var(--text);
  background:var(--panel2);
}

.mode.active{
  color:#fff;
  background:linear-gradient(
    135deg,
    #7655f5,
    #4f9cff
  );
  border-color:transparent;
}

.send{
  width:43px;
  height:43px;
  flex-shrink:0;
  border:0;
  border-radius:12px;
  background:var(--text);
  color:var(--bg);
  font-size:20px;
  font-weight:800;
  transition:.15s;
}

.send:hover{
  transform:translateY(-1px);
  opacity:.9;
}

.send:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* =========================
   QUICK ACTIONS
========================= */

.quick-title{
  width:min(820px,100%);
  margin-top:28px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1px;
}

.quick-grid{
  width:min(820px,100%);
  margin-top:9px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.quick-card{
  min-height:78px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--panel);
  color:var(--text);
  padding:13px;
  text-align:left;
  transition:.15s;
}

.quick-card:hover{
  background:var(--panel2);
  transform:translateY(-2px);
}

.quick-icon{
  font-size:18px;
  margin-bottom:7px;
}

.quick-name{
  font-size:12px;
  font-weight:650;
}

.quick-description{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

/* =========================
   CHAT
========================= */

.chat{
  flex:1;
  min-height:0;
  display:none;
  flex-direction:column;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:32px 20px 170px;
}

.message{
  width:min(820px,100%);
  margin:0 auto 30px;
}

.user-row{
  display:flex;
  justify-content:flex-end;
}

.user-bubble{
  max-width:76%;
  padding:12px 15px;
  border-radius:16px;
  background:var(--panel2);
  border:1px solid var(--border);
  white-space:pre-wrap;
  line-height:1.5;
  font-size:14px;
}

.assistant-label{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  margin-bottom:9px;
  letter-spacing:.4px;
}

.assistant-content{
  font-size:15px;
  line-height:1.75;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.assistant-content strong{
  font-weight:800;
}

.sources{
  margin-top:20px;
  padding-top:14px;
  border-top:1px solid var(--border);
}

.sources-heading{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-bottom:8px;
}

.source-card{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 10px;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:9px;
  margin-bottom:6px;
  text-decoration:none;
  color:var(--text);
}

.source-card:hover{
  background:var(--panel2);
}

.source-number{
  width:23px;
  height:23px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--panel2);
  color:var(--muted);
  font-size:10px;
  flex-shrink:0;
}

.source-info{
  min-width:0;
}

.source-title{
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.source-url{
  color:var(--muted);
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:2px;
}

/* =========================
   LOADING
========================= */

.loading-box{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:13px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--muted);
  animation:pulse 1s infinite alternate;
}

.dot:nth-child(2){
  animation-delay:.18s;
}

.dot:nth-child(3){
  animation-delay:.36s;
}

@keyframes pulse{
  from{opacity:.25}
  to{opacity:1}
}

.error{
  color:var(--danger);
  line-height:1.6;
  font-size:14px;
}

/* =========================
   CHAT COMPOSER
========================= */

.chat-composer{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:15px 20px 20px;
  background:linear-gradient(
    transparent,
    var(--bg) 28%
  );
}

.chat-composer-inner{
  width:min(820px,100%);
  margin:auto;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .quick-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:760px){

  .sidebar{
    position:fixed;
    left:-290px;
    top:0;
    bottom:0;
    transition:left .2s ease;
    box-shadow:15px 0 45px rgba(0,0,0,.35);
  }

  .sidebar.open{
    left:0;
  }

  .menu{
    display:block;
  }

  .mobile-logo{
    display:flex;
  }

  .model-pill{
    display:none;
  }

  .topbar{
    height:58px;
    padding:0 12px;
  }

  .top-actions{
    gap:5px;
  }

  .home{
    padding:48px 12px 100px;
  }

  .hero-logo{
    width:62px;
    height:62px;
    margin-bottom:18px;
  }

  .hero-title{
    font-size:35px;
    letter-spacing:-1.4px;
  }

  .hero-description{
    font-size:14px;
    max-width:430px;
  }

  .composer-container{
    margin-top:25px;
  }

  .composer{
    border-radius:17px;
  }

  .composer-bottom{
    align-items:flex-end;
  }

  .modes{
    max-width:calc(100% - 52px);
  }

  .mode{
    padding:6px 8px;
  }

  .quick-title{
    margin-top:22px;
  }

  .quick-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .quick-card{
    min-height:72px;
  }

  .messages{
    padding:20px 12px 155px;
  }

  .user-bubble{
    max-width:88%;
  }

  .chat-composer{
    padding:10px;
  }

}

@media(max-width:450px){

  .quick-grid{
    grid-template-columns:1fr 1fr;
    gap:7px;
  }

  .quick-card{
    padding:10px;
  }

  .quick-description{
    display:none;
  }

  .hero-title{
    font-size:31px;
  }

  textarea{
    font-size:15px;
  }

}

/* =========================
   OVERLAY
========================= */

.overlay{
  display:none;
}

@media(max-width:760px){

  .overlay.show{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:15;
  }

}
</style>
</head>
