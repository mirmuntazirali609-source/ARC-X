<style>

/* =========================
   ARC X — CORE
   ========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050816;
  --panel:#0a1022;
  --panel2:#0e1630;

  --text:#f5f7ff;
  --muted:#8d98b7;
  --accent:#7658ff;
  --accent2:#00b7ff;
  --green:#35d07f;
  --red:#ff5577;
}

html,
body{
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body{
  overflow-x:hidden;
}

button,
textarea{

}

button{
  border:0;
  cursor:pointer;
}

.app{
  min-height:100vh;
}


/* =========================
   SIDEBAR
   ========================= */

  left:0;
  top:0;
  bottom:0;

  border-right:1px solid var(--border);

.logo{

  border-radius:12px;

  background:

}

.logoName{

  font-weight:800;
}

.logoSub{
  font-size:9px;
  letter-spacing:1.5px;
  color:var(--muted);
  margin-top:2px;
}

.newChat{
  width:100%;
  padding:13px;
  border-radius:12px;
  background:
    linear-gradient(
      135deg,
      #7658ff,
      #5140d5
    );
  color:white;
  font-weight:750;
  margin-bottom:22px;
  box-shadow:
    0 8px 22px

}

.newChat:hover{

}

.sideTitle{

  font-weight:800;
  letter-spacing:1.4px;

  padding:8px;
}

.sideBtn{

  padding:11px;
  border-radius:9px;

}

.sideBtn:hover{

}

.history{

  overflow-y:auto;
  margin-top:7px;
}

.historyItem{

  border-radius:8px;
  font-size:12px;

  overflow:hidden;
  text-overflow:ellipsis;
  cursor:pointer;
}

.historyItem:hover{

  color:white;
}


/* =========================
   MAIN
   ========================= */

.main{
  margin-left:265px;
  min-height:100vh;
}


/* =========================
   TOP BAR
   ========================= */

.topbar{
  height:64px;
  padding:0 23px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:rgba(5,8,22,.78);
  backdrop-filter:blur(16px);
  position:sticky;
  top:0;
  z-index:20;
}

.menu{

  width:40px;
  height:40px;
  border-radius:10px;
  background:#111a35;
  color:white;
  font-size:20px;
}

.topTitle{
  font-size:13px;
  font-weight:700;
  color:#c4cbe0;
}

.status{

  align-items:center;
  gap:7px;
  font-size:12px;
  color:var(--muted);
}

.dot{

  height:8px;

}

.dot.online{

}

.dot.offline{

}


/* =========================
   HOME
   ========================= */

.home{

}

.hero{
  text-align:center;
  margin-bottom:32px;
}

.badge{

  background:rgba(118,88,255,.1);

}

.hero h1{

}

.gradient{

}

.hero p{

}


/* =========================
   SEARCH
   ========================= */

.search{

}

.searchBox{

}

.searchBox:focus-within{

/* =========================

   ========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translate(-50%,20px);
  padding:10px 15px;
  border-radius:9px;
  background:#121b38;
  border:1px solid var(--border);
  color:white;
  font-size:11px;
  opacity:0;
  pointer-events:none;

  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

   MOBILE

@media(max-width:850px){

  .menu{

  .home{

@media(max-width:480px){

  }

  .hero h1{

  .searchBottom{

  }

  }

  .grid{
    gap:8px;
  }

  .card{
    padding:13px;
  }

  .answer{
    padding:16px;
  }

}

body.light{

body.light .answer h1,
body.light .answer h2,

  color:#111827;
}

body.light .sideBtn,
body.light .historyItem{

}


/* =========================
   END OF CSS

<script>

/* =========================
   ARC X — CORE JAVASCRIPT
   ========================= */

var searchMode = "web";
var history = [];
var lastAnswer = "";


/* =========================
   ELEMENTS
   ========================= */

var sidebar = document.getElementById("sidebar");
var menuBtn = document.getElementById("menuBtn");

var queryBox = document.getElementById("query");
var sendBtn = document.getElementById("send");

var loading = document.getElementById("loading");

var result = document.getElementById("result");
var answerBox = document.getElementById("answer");
var resultMode = document.getElementById("resultMode");

var sourcesBox = document.getElementById("sourcesBox");
var sourcesBoxInner = document.getElementById("sources");

var statusDot = document.getElementById("statusDot");
var statusText = document.getElementById("statusText");

var toast = document.getElementById("toast");


/* =========================
   TOAST
   ========================= */

var toastTimer = null;

function showToast(message){

  if(!toast){
    return;
  }

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(function(){

    toast.classList.remove("show");

  },2400);
}


/* =========================
   STATUS
   ========================= */

function setStatus(type,message){

  statusText.textContent = message;

  statusDot.classList.remove(
    "online",
    "offline",
    "checking"
  );

  statusDot.classList.add(type);
}


/* =========================
   ESCAPE HTML
   ========================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   MARKDOWN RENDERER
   ========================= */

function renderMarkdown(text){

  if(!text){
    return "";
  }

  var safe = escapeHTML(text);

  var codeBlocks = [];

  safe = safe.replace(
    /```([\s\S]*?)```/g,
    function(match,code){

      var index = codeBlocks.length;

      codeBlocks.push(
        "<pre><code>" +
        code.trim() +
        "</code></pre>"
      );

      return "___ARC_CODE_" + index + "___";
    }
  );


  safe = safe.replace(
    /^### (.*)$/gm,
    "<h3>$1</h3>"
  );

  safe = safe.replace(
    /^## (.*)$/gm,
    "<h2>$1</h2>"
  );

  safe = safe.replace(
    /^# (.*)$/gm,
    "<h1>$1</h1>"
  );


  safe = safe.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );


  safe = safe.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );


  var lines = safe.split("\n");
  var output = [];
  var inList = false;


  for(var i = 0; i < lines.length; i++){

    var line = lines[i];


    if(
      line.indexOf("- ") === 0 ||
      line.indexOf("* ") === 0
    ){

      if(!inList){
        output.push("<ul>");
        inList = true;
      }

      output.push(
        "<li>" +
        line.substring(2) +
        "</li>"
      );

      continue;
    }


    if(inList){

      output.push("</ul>");
      inList = false;
    }


    if(
      line.trim() === ""
    ){

      continue;
    }


    if(
      line.indexOf("<h1>") === 0 ||
      line.indexOf("<h2>") === 0 ||
      line.indexOf("<h3>") === 0 ||
      line.indexOf("<pre>") === 0 ||
      line.indexOf("___ARC_CODE_") === 0
    ){

      output.push(line);

    }else{

      output.push(
        "<p>" + line + "</p>"
      );

    }

  }


  if(inList){
    output.push("</ul>");
  }


  var html = output.join("");


  html = html.replace(
    /___ARC_CODE_(\d+)___/g,
    function(match,index){
      return codeBlocks[Number(index)];
    }
  );


  return html;
}


/* =========================
   GET ANSWER
   ========================= */

function getAnswer(data){

  if(!data){
    return "";
  }


  if(typeof data === "string"){
    return data;
  }


  var possible = [

    data.answer,
    data.response,
    data.result,
    data.text,
    data.content,
    data.message,

    data.data && data.data.answer,
    data.data && data.data.response,
    data.data && data.data.text,

    data.result && data.result.answer,
    data.result && data.result.text

  ];


  for(var i = 0; i < possible.length; i++){

    if(
      typeof possible[i] === "string" &&
      possible[i].trim()
    ){

      return possible[i];
    }

  }


  return "";
}


/* =========================
   GET SOURCES
   ========================= */

function getSources(data){

  if(!data){
    return [];
  }


  var sources =
    data.sources ||
    data.results ||
    data.citations ||
    data.references ||
    (data.data && data.data.sources) ||
    [];


  if(!Array.isArray(sources)){
    return [];
  }


  return sources;
}


/* =========================
   RENDER SOURCES
   ========================= */

function renderSources(list){

  sourcesBoxInner.innerHTML = "";

  if(
    !Array.isArray(list) ||
    list.length === 0
  ){

    sourcesBox.style.display = "none";
    return;
  }


  var count = 0;


  list.forEach(function(item){

    if(count >= 10){
      return;
    }


    var title = "";
    var url = "";


    if(typeof item === "string"){

      url = item;
      title = item;

    }else if(item){

      title =
        item.title ||
        item.name ||
        item.source ||
        item.url ||
        "Source";

      url =
        item.url ||
        item.link ||
        item.href ||
        "";
    }


    if(!url){
      return;
    }


    var source = document.createElement("a");

    source.className = "source";
    source.href = url;
    source.target = "_blank";
    source.rel = "noopener noreferrer";

    source.textContent =
      title + " — " + url;


    sourcesBoxInner.appendChild(source);

    count++;

  });


  if(count > 0){

    sourcesBox.style.display = "block";

  }else{

    sourcesBox.style.display = "none";
  }
}


/* =========================
   HISTORY
   ========================= */

function loadHistory(){

  try{

    var saved =
      localStorage.getItem("arcx_history");

    if(saved){

      var parsed =
        JSON.parse(saved);

      if(Array.isArray(parsed)){
        history = parsed;
      }

    }

  }catch(error){

    history = [];
  }
}


function saveHistory(){

  try{

    localStorage.setItem(
      "arcx_history",
      JSON.stringify(history)
    );

  }catch(error){

    /* Ignore storage errors */
  }
}


function addHistory(text){

  if(!text){
    return;
  }


  history = history.filter(function(item){

    return item !== text;

  });


  history.unshift(text);


  if(history.length > 20){

    history =
      history.slice(0,20);

  }


  saveHistory();
  renderHistory();
}


function renderHistory(){

  var historyBox =
    document.getElementById("history");

  if(!historyBox){
    return;
  }


  historyBox.innerHTML =
    '<div class="sideTitle">RECENT</div>';


  if(history.length === 0){

    var empty =
      document.createElement("div");

    empty.className = "historyEmpty";
    empty.textContent = "No recent chats";

    historyBox.appendChild(empty);

    return;
  }


  history.forEach(function(item){

    var button =
      document.createElement("button");

    button.className = "historyItem";

    button.textContent = item;

    button.title = item;


    button.addEventListener(
      "click",
      function(){

        queryBox.value = item;

        queryBox.dispatchEvent(
          new Event("input")
        );

        closeSidebar();

        queryBox.focus();

      }
    );


    historyBox.appendChild(button);

  });
}

/* =========================
   SEARCH MODE
   ========================= */

function setSearchMode(mode){

  if(
    mode !== "web" &&
    mode !== "ai" &&
    mode !== "research"
  ){

    mode = "web";
  }


  searchMode = mode;


  var modeButtons =
    document.querySelectorAll(".mode");


  modeButtons.forEach(function(button){

    button.classList.toggle(
      "active",
      button.dataset.mode === mode
    );

  });


  if(mode === "web"){

    queryBox.placeholder =
      "Search the web with ARC X...";

  }else if(mode === "ai"){

    queryBox.placeholder =
      "Ask ARC X anything...";

  }else{

    queryBox.placeholder =
      "What should ARC X research deeply?";

  }
}


/* =========================
   API CALL
   ========================= */

async function callAPI(query){

  var endpoint =
    "/api/search-answer";

  var body = {
    query: query
  };


  if(searchMode === "ai"){

    endpoint = "/api/chat";

    body = {
      message: query,
      query: query
    };

  }else if(searchMode === "research"){

    endpoint = "/api/research";

    body = {
      query: query
    };

  }


  var response;


  try{

    response = await fetch(
      endpoint,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify(body)
      }
    );

  }catch(error){

    throw new Error(
      "Unable to connect to ARC X server."
    );
  }


  var rawText = "";


  try{

    rawText =
      await response.text();

  }catch(error){

    throw new Error(
      "ARC X server returned no response."
    );
  }


  var data;


  try{

    data =
      rawText
        ? JSON.parse(rawText)
        : {};

  }catch(error){

    throw new Error(
      "ARC X server returned an invalid response."
    );
  }


  if(!response.ok){

    throw new Error(
      data.error ||
      data.message ||
      "Request failed: HTTP " +
      response.status
    );

  }


  return data;
}


/* =========================
   RUN SEARCH
   ========================= */

async function runSearch(){

  var query =
    queryBox.value.trim();


  if(!query){

    showToast(
      "Type a question first."
    );

    queryBox.focus();

    return;
  }


  addHistory(query);

  closeSidebar();


  sendBtn.disabled = true;

  result.classList.remove("show");

  sourcesBox.style.display = "none";

  answerBox.innerHTML = "";

  loading.classList.add("show");


  if(searchMode === "web"){

    loading.textContent =
      "Searching the web...";

    resultMode.textContent =
      "WEB SEARCH";

  }else if(searchMode === "ai"){

    loading.textContent =
      "ARC X is thinking...";

    resultMode.textContent =
      "AI CHAT";

  }else{

    loading.textContent =
      "Performing deep research...";

    resultMode.textContent =
      "DEEP RESEARCH";

  }


  /* Part 4 continues here. */
  /* =========================
   API RESPONSE
   ========================= */

  try{

    var data = await callAPI(query);

    var answer = getAnswer(data);
    var sources = getSources(data);


    if(!answer){

      answer =
        "ARC X received a response, but no answer text was returned.";

    }


    lastAnswer = answer;


    answerBox.innerHTML =
      renderMarkdown(answer);


    renderSources(sources);


    result.classList.add("show");

    loading.classList.remove("show");


    result.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });


  }catch(error){

    resultMode.textContent =
      "ERROR";


    answerBox.innerHTML =
      "<p><strong>" +
      "ARC X could not complete the request." +
      "</strong></p>" +

      "<p>" +

      escapeHTML(
        error.message ||
        "Unknown server error."
      ) +

      "</p>";


    result.classList.add("show");

    sourcesBox.style.display =
      "none";


  }finally{

    loading.classList.remove("show");

    sendBtn.disabled = false;

  }

}

/* =========================
   COPY ANSWER
   ========================= */

document
  .getElementById("copy")
  .addEventListener(
    "click",
    async function(){

      if(!lastAnswer){

        showToast(
          "There is no answer to copy."
        );

        return;

      }


      try{

        await navigator.clipboard.writeText(
          lastAnswer
        );

        showToast(
          "Answer copied"
        );

      }catch(error){

        try{

          var temp =
            document.createElement("textarea");

          temp.value =
            lastAnswer;

          temp.style.position =
            "fixed";

          temp.style.opacity =
            "0";

          document.body.appendChild(temp);

          temp.select();

          document.execCommand("copy");

          document.body.removeChild(temp);

          showToast(
            "Answer copied"
          );

        }catch(copyError){

          showToast(
            "Copy failed"
          );

        }

      }

    }
  );

/* =========================
   HEALTH CHECK
   ========================= */

async function checkHealth(){

  setStatus(
    "checking",
    "Connecting..."
  );


  try{

    var response =
      await fetch(
        "/api/health?x=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    var data =
      await response.json();


    if(
      response.ok &&
      data &&
      data.ok === true
    ){

      setStatus(
        "online",
        "Online"
      );

    }else{

      setStatus(
        "offline",
        "Server Error"
      );

    }


  }catch(error){

    setStatus(
      "offline",
      "Offline"
    );

  }

}
